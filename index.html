    //               AI要約／似た質問への合流／通報・ガイドライン／お知らせ／学年×前期・後期のパーソナライズ／
    //               生活ハックカテゴリ／仲間・イベント（仲間募集とイベントを統合）／回答で貯まる「閲覧チケット」で過去問を見る仕組み
    //   ・外したもの：ポイント・楽天ポイント交換・協力店チケット／記事投稿・OCR／自己分析／プレミアム投票／休講などの公式情報
    //   ・保存しません：画面を閉じる・再読み込みで初期状態に戻ります（デモ）

    // ============================================================
    // 📚 授業名の表記ゆれを抑える（全角/半角・空白・ローマ数字をそろえて比べる）
    //   本番は授業マスタ（WBS 1.10・2.13）。運営が管理画面で名寄せする（2.14）
    // ============================================================
    const normCourse = (s) => (s || "").normalize("NFKC").toLowerCase()
      .replace(/[\s・･\-ー－—_]/g, "").replace(/[()（）]/g, "")
      .replace(/(iv|iii|ii|i)$/, (m) => ({ i: "1", ii: "2", iii: "3", iv: "4" }[m]));
    // 入力中の文字に合う授業名を、よく使われている順に返す
    const matchCourses = (dict, q, limit = 5) => {
      const n = normCourse(q); if (!n) return [];
      return dict.filter(c => c.norm.includes(n) || (n.length >= 3 && n.includes(c.norm)))
        .sort((a, b) => (b.norm.startsWith(n) - a.norm.startsWith(n)) || (b.q + b.k * 2) - (a.q + a.k * 2)).slice(0, limit);
    };

    const INPUT = "w-full bg-sunk text-ink placeholder:text-mute rounded-2xl px-4 py-3 text-[14px] outline-none border border-transparent focus:border-brand focus:bg-surface transition-colors";
    const BTN_PRIMARY = "bg-brand text-on-brand font-black rounded-2xl py-3.5 text-[15px] tracking-wide shadow-soft press disabled:opacity-50";
    const BTN_SOFT = "bg-sunk text-ink font-bold rounded-2xl py-3 text-[14px] press";
    const LABEL = "block text-[12px] font-bold text-sub mb-1.5";
    const CHIP = (on) => cx("px-3 py-1.5 rounded-full text-[12.5px] font-bold whitespace-nowrap flex-shrink-0 flex items-center gap-1 press border", on ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line");

    let _scrollLocks = 0;
    function useScrollLock() {
      useEffect(() => {
        const html = document.documentElement, body = document.body;
        if (_scrollLocks++ === 0) { html.style.overflow = "hidden"; body.style.overflow = "hidden"; html.style.overscrollBehavior = "none"; }
        return () => { if (--_scrollLocks === 0) { html.style.overflow = ""; body.style.overflow = ""; html.style.overscrollBehavior = ""; } };
      }, []);
    }

    function Icon({ n, fill, size, className }) {
      return <span className={cx("ms", fill && "fill", className)} style={size ? { fontSize: size } : undefined} aria-hidden="true">{n}</span>;
    }

    // v3：学年ごとの色（ホームの丸・アバターで共通）。1年＝青、2年＝ピンク、3年＝緑、4年以上＝オレンジ、院＝紫、答えていない＝グレー
    const gradeRGB = (g) => !g ? "140 146 146" : g >= 5 ? "132 85 224" : ["61 109 224", "217 70 140", "31 158 138", "217 119 43"][Math.min(g, 4) - 1];
    function Avatar({ user, size = 40 }) {
      if (user && user.official) return <img src={LOGO_MARK} alt="" className="flex-shrink-0" style={{ width: size, height: size }} />;
      const g = user && user.grade;
      // 学年の色の丸に、学年の数字（匿名でも学年は表示名に出ているので同じ情報）。学部は表示をオンにした人だけ頭文字を添える
      const text = !user ? "" : `${!user.anon && user.fac ? String(user.fac).charAt(0) : ""}${g ? (g >= 5 ? "院" : g) : ""}`;
      return (
        <div className="rounded-full flex items-center justify-center font-head font-black flex-shrink-0 text-white"
          style={{ width: size, height: size, fontSize: size * (text.length > 1 ? 0.34 : 0.42), background: `rgb(${gradeRGB(g)})` }} aria-hidden="true">
          {text || <Icon n="person" fill size={size * 0.55} />}
        </div>
      );
    }

    // v3：話題ごとの色（ライト・ダークどちらでも読める濃さ）。文字は増やさず、色で見分けられるように
    const CAT_COLOR = { "授業・過去問": "61 109 224", "履修・楽単": "217 119 43", "ゼミ・研究室": "132 85 224", "就活・インターン": "31 158 138", "生活ハック": "185 133 0", "新歓・サークル": "217 70 140", "暮らし・通学": "42 143 208", "仲間募集": "132 85 224", "運営のお題": "53 181 151", "その他": "110 118 118" };
    const catRGB = (k) => CAT_COLOR[k] || CAT_COLOR["その他"];
    function CategoryChip({ cat }) {
      const m = catMeta(cat); const c = catRGB(cat);
      return <span className="text-[12px] font-bold px-2.5 py-0.5 rounded-full inline-flex items-center gap-1" style={{ background: `rgb(${c} / .13)`, color: `rgb(${c})` }}><Icon n={m.icon} fill size={13} />{m.short}</span>;
    }
    function CountUp({ to, ms = 900 }) {
      const [v, setV] = useState(0);
      useEffect(() => {
        const t0 = performance.now(); let raf;
        const step = (t) => { const k = Math.min(1, (t - t0) / ms); setV(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
      }, [to]);
      return <>{v.toLocaleString()}</>;
    }
    // ペタした先輩の学年を丸で重ねる（だれが答えているかを、文字なしで）
    const GradeDot = ({ u, i }) => (
      <span className="w-6 h-6 rounded-full border-2 border-surface flex items-center justify-center text-[10px] font-black text-white flex-shrink-0"
        style={{ background: `rgb(${gradeRGB(u.grade)})`, marginLeft: i ? -7 : 0 }}>{u.grade ? (u.grade >= 5 ? "院" : u.grade) : "?"}</span>
    );
    // 👤 回答者のカード（回答の名前を押すと出る）：学年・回答した数・助かった！の数だけ。チケット・回答の一覧・名前は見せない
    //   ・デモ：ほかの人の数字は表示名から作った見本。本番はサーバーで集計する
    const demoStats = (u) => {
      const h = [...`${u.fac}${u.grade}${u.anon}`].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
      const answers = 3 + (h % 38), thanks = answers * (2 + (h % 4)) + (h % 7), best = Math.floor(answers / (6 + (h % 5)));
      return { answers, thanks, best };
    };
    function AnswererCard({ user, stats, onClose }) {
      const s = stats || demoStats(user);
      return (
        <Sheet onClose={onClose} z={62}>
          <SheetHeader title="ペタした人" icon="person" onClose={onClose} />
          <div className="px-5 pb-6 pt-1 space-y-4">
            <div className="flex items-center gap-3">
              <Avatar user={user} size={52} />
              <div className="min-w-0">
                <p className="font-head font-black text-[18px]">{user.mine ? "あなた" : displayName(user)}</p>
                <p className="text-[12px] text-sub flex items-center gap-1"><Icon n="verified" fill size={14} className="text-brand-deep" />{U.name}・大学メールで確認済み</p>
              </div>
            </div>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div className="bg-sunk rounded-2xl py-3"><p className="text-[11px] text-sub font-bold">ペタした</p><p className="font-head font-black text-[22px]">{s.answers}</p></div>
              <div className="bg-sunk rounded-2xl py-3"><p className="text-[11px] text-sub font-bold">助かった！</p><p className="font-head font-black text-[22px] text-love-ink">{s.thanks}</p></div>
              <div className="bg-sunk rounded-2xl py-3"><p className="text-[11px] text-sub font-bold">いちばん助かった</p><p className="font-head font-black text-[22px] text-brand-deep">{s.best}</p></div>
            </div>
            <p className="text-[11.5px] text-mute flex items-start gap-1 leading-relaxed"><Icon n="lock" size={14} className="mt-px flex-shrink-0" />ほかのペタの一覧や名前、閲覧チケットの枚数は表示されません</p>
          </div>
        </Sheet>
      );

    function MineBadge({ type, className }) {

    function SolvedBadge({ recruit }) {

    // ボトムシート（外側タップ／つまみを下に引くと閉じる）
    function Sheet({ onClose, z = 50, children }) {
      useScrollLock();
      const [dy, setDy] = useState(0);
      const [dragging, setDragging] = useState(false);
      const drag = useRef({ y: null, t: 0, v: 0, last: 0 });
      const onDown = (e) => { drag.current = { y: e.clientY, t: Date.now(), v: 0, last: e.clientY }; setDragging(true); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} };
      const onMove = (e) => {
        if (drag.current.y == null) return;
        const now = Date.now(); const dt = Math.max(1, now - drag.current.t);
        drag.current.v = (e.clientY - drag.current.last) / dt; drag.current.last = e.clientY; drag.current.t = now;
        setDy(Math.max(0, e.clientY - drag.current.y));
      };
      const onUp = () => {
        if (drag.current.y == null) return;
        const fast = drag.current.v > 0.6; drag.current.y = null; setDragging(false);
        if (dy > 110 || (fast && dy > 30)) onClose(); else setDy(0);
      };
      return (
        <div className="fixed inset-0 flex items-end justify-center animate-fade-in" style={{ zIndex: z, background: `rgb(10 20 18 / ${Math.max(0.12, 0.5 - dy / 700)})`, touchAction: "none" }} onClick={onClose}>
          <div className="bg-surface text-ink w-full max-w-md rounded-t-[2rem] max-h-[92vh] flex flex-col overflow-hidden animate-slide-up shadow-lift"
            style={{ transform: dy ? `translateY(${dy}px)` : undefined, transition: dragging ? "none" : "transform .25s cubic-bezier(.22,1,.36,1)", touchAction: "auto" }}
            onClick={(e) => e.stopPropagation()}>
            <div className="pt-3 pb-2 flex justify-center cursor-grab touch-none select-none" onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp} role="presentation">
              <div className="w-10 h-1.5 bg-line rounded-full"></div>
            </div>
            {children}
          </div>
        </div>
      );
    }
    function SheetHeader({ title, icon, onClose, onBack, right }) {
      return (
        <div className="px-5 py-2 flex justify-between items-center gap-2">
          <div className="flex items-center gap-1 min-w-0">
            {onBack && <button onClick={onBack} aria-label="戻る" className="w-9 h-9 -ml-2 rounded-full flex items-center justify-center text-ink press"><Icon n="arrow_back_ios_new" size={20} /></button>}

          </div>
          <div className="flex items-center gap-1 flex-shrink-0">
            {right}

    }
    function Dialog({ onClose, children, z = 60 }) {
      useScrollLock();
      return (
        <div className="fixed inset-0 flex items-center justify-center p-4 animate-fade-in" style={{ zIndex: z, background: "rgb(10 20 18 / .55)" }} onClick={onClose}>
          <div className="bg-surface text-ink w-full max-w-sm rounded-[2rem] shadow-lift max-h-[88vh] overflow-y-auto animate-slide-up" onClick={(e) => e.stopPropagation()}>{children}</div>
        </div>
      );
    }
    function Segmented({ value, onChange, options }) {
      return (
        <div className="bg-sunk rounded-2xl p-1 flex gap-1" role="tablist">
          {options.map(o => (
            <button key={o.value} role="tab" aria-selected={value === o.value} onClick={() => onChange(o.value)}
              className={cx("flex-1 py-2 rounded-xl text-[13px] font-bold flex items-center justify-center gap-1.5 press min-w-0", value === o.value ? "bg-surface text-ink shadow-soft font-black" : "text-sub")}>
              {o.icon && <Icon n={o.icon} fill={value === o.value} size={18} />}
              <span className="truncate">{o.label}</span>
            </button>
          ))}
        </div>
      );
    }
    function Toggle({ on, onChange, label }) {
      return (
        <button role="switch" aria-checked={on} aria-label={label} onClick={() => onChange(!on)}
          className={cx("w-12 h-7 rounded-full p-0.5 flex-shrink-0 transition-colors", on ? "bg-brand" : "bg-line")}>
          <span className={cx("block w-6 h-6 rounded-full bg-white shadow-soft transition-transform", on && "translate-x-5")}></span>
        </button>
      );
    }
    function SectionHead({ title, sub, action, onAction, icon }) {
      return (
        <div className="flex items-end justify-between px-1 gap-2">
          <div className="min-w-0">
            <h2 className="font-head font-black text-[17px] flex items-center gap-1.5">{icon && <Icon n={icon} fill size={20} className="text-brand-deep" />}{title}</h2>
            {sub && <p className="text-[12px] text-sub leading-snug">{sub}</p>}
          </div>
          {action && <button onClick={onAction} className="text-[12px] font-bold text-brand-deep press flex-shrink-0 flex items-center">{action}<Icon n="chevron_right" size={16} /></button>}
        </div>
      );
    }
    function ScrollRow({ className, children }) {
      const ref = useRef(null);
      const [more, setMore] = useState(false);
      const check = () => { const el = ref.current; if (el) setMore(el.scrollWidth - el.clientWidth - el.scrollLeft > 6); };
      useEffect(() => { check(); const t = setTimeout(check, 300); return () => clearTimeout(t); });
      return <div ref={ref} onScroll={check} className={cx(className, more && "fade-r")}>{children}</div>;
    }
    // 📚 授業名の入力（入力し始めると、ほかの人が入れた授業名を候補に出す）
    function CourseInput({ id, dict, value, onChange, onPick, inputRef, placeholder, newLabel }) {
      const v = value.trim();
      const n = normCourse(v);
      const same = n ? dict.find(c => c.norm === n) : null;          // 表記だけちがう同じ授業
      const done = same && same.name === v;                            // 登録済みの名前どおり
      const list = done ? [] : matchCourses(dict, v).filter(c => c !== same);
      const meta = (c) => [c.q ? `質問${c.q}` : "", c.k ? `過去問${c.k}` : ""].filter(Boolean).join("・");
      // 候補が画面の下に隠れないよう、入力中は欄を上の方へ寄せる
      const boxRef = useRef(null);
      const reveal = () => setTimeout(() => { if (boxRef.current) boxRef.current.scrollIntoView({ block: "start", behavior: "smooth" }); }, 50);
      return (
        <div ref={boxRef} className="space-y-1.5 scroll-mt-10">
          <div className="relative">
            <Icon n="school" size={18} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-mute pointer-events-none" />
            <input id={id} ref={inputRef} value={value} onChange={(e) => { onChange(e.target.value); reveal(); }} onFocus={reveal} placeholder={placeholder} autoComplete="off"
              className={cx(INPUT, "pl-10")} role="combobox" aria-expanded={list.length > 0} aria-controls={`${id}-list`} />
          </div>
          {done && (
            <div className="flex items-center justify-between gap-2">
              <p className="text-[12px] font-bold text-brand-deep flex items-center gap-1"><Icon n="check_circle" fill size={15} />登録済みの授業名です{meta(same) && `（${meta(same)}）`}</p>
              {newLabel && <button type="button" onClick={() => onPick(v)} className="text-[12.5px] font-black text-on-brand bg-brand rounded-full px-3 py-1.5 press flex-shrink-0">{newLabel.replace(/^を/, "")}</button>}
            </div>
          )}
          {same && !done && (
            <button type="button" onClick={() => onPick(same.name)} className="w-full text-left bg-brand-tint border border-brand/40 rounded-2xl px-3 py-2 text-[13px] press flex items-center gap-1.5">
              <Icon n="lightbulb" fill size={16} className="text-brand-deep" /><span>もしかして <b>「{same.name}」</b>？　同じ授業なら押してそろえてください</span>
            </button>
          )}
          {v && !done && (list.length > 0 ? (
            <div id={`${id}-list`} role="listbox" className="bg-surface border border-line rounded-2xl overflow-hidden">
              <p className="text-[11px] font-bold text-mute px-3 pt-2 pb-1">ほかの人が入れた授業名</p>
              {list.map(c => (
                <button key={c.norm} type="button" role="option" aria-selected="false" onClick={() => onPick(c.name)} className="w-full text-left px-3 py-2.5 border-t border-line/60 flex items-center gap-2 press">
                  <Icon n="menu_book" size={17} className="text-brand-deep flex-shrink-0" />
                  <span className="flex-1 min-w-0 font-bold text-[13.5px] truncate">{c.name}</span>
                  {meta(c) && <span className="text-[11px] text-mute flex-shrink-0">{meta(c)}</span>}
                </button>
              ))}
              {newLabel && <button type="button" onClick={() => onPick(v)} className="w-full text-left px-3 py-2.5 border-t border-line/60 text-[12.5px] text-sub press flex items-center gap-1.5"><Icon n="add" size={16} />どれでもない →「{v}」{newLabel}</button>}
            </div>
          ) : !same && (
            <div className="text-[12px] text-sub bg-sunk rounded-2xl px-3 py-2 space-y-1.5">
              <p className="flex items-start gap-1"><Icon n="info" size={15} className="mt-px flex-shrink-0" />まだだれも入れていない授業名です。シラバスどおりの正式な名前だと、ほかの人の質問や過去問とまとまりやすくなります。</p>
              {newLabel && <button type="button" onClick={() => onPick(v)} className="font-bold text-brand-deep press">「{v}」{newLabel}</button>}
            </div>
          ))}
        </div>
      );
    }

    // 📌 自分の投稿を先頭に（投稿できたことが分かるように）
    //   ・自分の投稿が、ほかの人のどの投稿よりも新しい間だけ先頭に置く
    //   ・ほかの人の投稿が追加される／解決済み・締め切りにすると、通常の並びに戻る
    const pinMine = (list, isMine, at, done) => {
      const othersNewest = Math.max(0, ...list.filter(x => !isMine(x)).map(at));
      return list.filter(x => isMine(x) && !done(x) && at(x) > othersNewest).sort((a, b) => at(b) - at(a));
    };
    function MyPinned({ label, children }) {
      return (
        <div className="space-y-1.5 animate-fade-up">
          <p className="text-[12px] font-black text-brand-deep flex items-center gap-1 px-1"><Icon n="check_circle" fill size={16} />{label}</p>
          <div className="rounded-3xl ring-2 ring-brand ring-offset-2 ring-offset-bg">{children}</div>
        </div>
      );
    }

    function EmptyState({ icon, text, action, onAction }) {
      return (
        <div className="text-center py-10 space-y-3">
          <Icon n={icon || "search_off"} size={36} className="text-mute" />
          <p className="text-[13px] text-mute">{text}</p>
          {action && <button onClick={onAction} className={cx(BTN_SOFT, "px-5")}>{action}</button>}
        </div>
      );
    }

    // ============================================================
    // 🃏 質問のカード
    // ============================================================
    // 横スクロール用（回答を待っている質問・仲間募集）
    function QuestionCard({ post, onOpen, wide, unread }) {
      const mine = post.author.mine;
      const recruit = post.category === "仲間募集";
      const answerers = post.comments.slice(0, 3);
      return (
        <button onClick={onOpen} className={cx(wide ? "w-full" : "w-[252px] flex-shrink-0", "text-left bg-surface rounded-3xl border shadow-soft p-4 flex flex-col gap-2.5 press relative", mine ? "border-brand ring-2 ring-brand/20" : "border-line/70")}>
          <span className="flex items-center gap-1.5 text-[11px] text-mute">
            {mine ? <MineBadge /> : <><Icon n={catMeta(post.category).icon} fill size={14} className="text-brand-deep" />{catMeta(post.category).short}・{displayName(post.author)}</>}
            {unread && <span className="ml-auto bg-brand text-on-brand text-[11px] font-black px-2 py-0.5 rounded-full flex items-center gap-0.5"><Icon n="notifications_active" fill size={12} />新着</span>}
          </span>
          {post.joiners.length > 0 && (
            <span className="self-start inline-flex items-center gap-0.5 bg-brand-tint text-brand-deep text-[11px] font-black px-2 py-0.5 rounded-full"><Icon n="group" size={13} />同じ疑問 {post.joiners.length}人</span>
          )}
          <span className="flex gap-2">
            <span className="font-head font-black text-[22px] leading-none text-brand">{recruit ? <Icon n="diversity_3" fill size={22} /> : "Q."}</span>
            <span className="font-head font-bold text-[15px] leading-snug line-clamp-3">{plainTitle(post.title)}</span>
          </span>
          <span className="mt-auto flex items-center justify-between gap-2 pt-1">
            {answerers.length > 0 ? (
              <span className="flex items-center gap-1.5 min-w-0">
                <span className="flex -space-x-2">{answerers.map(c => <span key={c.id} className="ring-2 ring-surface rounded-full"><Avatar user={c.user} size={22} /></span>)}</span>
                <span className="text-[11px] text-sub truncate">{post.comments.length}人が{recruit ? "参加希望" : "ペタ"}</span>
              </span>
            ) : <span className="text-[11px] text-sub">{agoLabel(post.at)}</span>}
            {mine
              ? <span className="flex-shrink-0 border border-brand text-brand-deep text-[12px] font-black px-3 py-1.5 rounded-full">確認する</span>
              : <span className="flex-shrink-0 bg-brand text-on-brand text-[12px] font-black px-3 py-1.5 rounded-full">{recruit ? "参加したい" : "答える"}</span>}
          </span>
        </button>
      );
    }

    // 縦の一覧用
    function QuestionRow({ post, onOpen, onWatch, tokens, unread, showTop, delay }) {
      const mine = post.author.mine;
      const recruit = post.category === "仲間募集";
      const solved = post.bestAnswerId || post.closed;
      const n = post.comments.length;
      // シンプル版：いちばん助かった（なければ反応の多い）回答を1件だけ見せ、開かなくても中身が分かるように
      const top = showTop && !recruit && n > 0 ? (post.comments.find(c => c.id === post.bestAnswerId) || [...post.comments].sort((a, b) => (b.thanks || 0) - (a.thanks || 0))[0]) : null;
      return (
        <article onClick={onOpen} className={cx("relative overflow-hidden bg-surface rounded-3xl p-4 shadow-soft border cursor-pointer press animate-fade-up space-y-2", unread ? "border-brand/60 ring-2 ring-brand/15" : mine ? "border-brand/50" : "border-line/70")} style={delay != null ? { animationDelay: `${delay}ms` } : undefined}>
          <div className="flex items-center gap-1.5 flex-wrap">
            <CategoryChip cat={post.category} />
            {mine ? <MineBadge /> : <span className="text-[12px] text-mute">{displayName(post.author)}</span>}
            <span className="text-[12px] text-mute">・{agoLabel(post.at)}</span>
            {unread && <span className="ml-auto bg-brand text-on-brand text-[11px] font-black px-2 py-0.5 rounded-full">新着</span>}
          </div>
          <h3 className="font-head font-bold text-[15.5px] leading-snug flex gap-1.5">
            <span className="text-brand font-black">{recruit ? "募" : "Q."}</span>
            <span className="min-w-0 break-words"><Highlight text={plainTitle(post.title)} tokens={tokens} /></span>
          </h3>
          {top && (
            <div className="rounded-2xl px-3 py-2.5 space-y-0.5 bg-[rgb(var(--peta))]">
              <p className="text-[11px] font-bold text-sub flex items-center gap-1">{post.bestAnswerId === top.id ? <><Icon n="workspace_premium" fill size={13} className="text-brand-deep" /><span className="text-brand-deep">いちばん助かったペタ</span></> : <><Icon n={post.odai ? "lightbulb" : "favorite"} fill size={12} className={post.odai ? "text-brand-deep" : "text-love"} />{displayName(top.user)}のペタ</>}
                {(top.thanks || 0) > 0 && <span className="ml-auto text-love-ink font-black flex items-center gap-0.5"><Icon n="favorite" fill size={13} className="text-love" />{top.thanks}</span>}</p>
              <p className="text-[13px] leading-relaxed line-clamp-2">{top.text}</p>
            </div>
          )}
          {tokens && tokens.length > 0 && <p className="text-[12.5px] text-sub line-clamp-1"><Highlight text={post.content} tokens={tokens} /></p>}
          <div className="flex items-center justify-between gap-2 pt-0.5">
            <div className="flex items-center gap-2.5 text-[12px] text-mute flex-wrap">
              {solved ? <SolvedBadge recruit={recruit} /> : (
                n ? (
                  <span className="inline-flex items-center gap-1.5 font-bold text-sub">
                    {!recruit && <span className="flex">{post.comments.slice(0, 3).map((c, i) => <GradeDot key={c.id} u={c.user} i={i} />)}</span>}
                    {recruit && <Icon n="forum" size={15} />}{recruit ? "参加希望" : "ペタ"} {n}
                  </span>
                ) : (
                  <span className="inline-flex items-center gap-1.5 font-bold text-love-ink">
                    <span className="w-2 h-2 rounded-full bg-love pulse-dot"></span>{recruit ? "参加者募集中" : "ペタ募集中"}
                  </span>
                )
              )}
              {n >= SUMMARY_MIN_ANSWERS && !recruit && <span className="bg-brand-tint text-brand-deep text-[11px] font-black px-2 py-0.5 rounded-full inline-flex items-center gap-0.5"><Icon n="auto_awesome" fill size={12} />AI要約</span>}
              {post.joiners.length > 0 && <span className="inline-flex items-center gap-0.5 font-bold text-brand-deep"><Icon n="group" size={14} />同じ疑問 {post.joiners.length}</span>}
            </div>
            {!mine && (
              <button onClick={(e) => { e.stopPropagation(); onWatch(post.id); }} aria-pressed={post.watched} aria-label="気になる"
                className={cx("flex items-center gap-1 px-2.5 py-1 rounded-full text-[12px] font-bold press flex-shrink-0", post.watched ? "bg-love-tint text-love-ink" : "text-mute")}>
                <Icon n="bookmark" fill={post.watched} size={16} className={post.watched ? "text-love" : ""} />気になる
              </button>
            )}
          </div>
        </article>
      );
    }

    // ============================================================
    // ✨ AI要約（回答が多い質問）
    // ============================================================
    function AnswerSummary({ post, onJump, onReportSummary }) {
      const s = useMemo(() => summarizeAnswers(post.comments), [post.comments]);
      return (
        <div className="bg-sunk rounded-3xl p-4 space-y-3">
          <div className="flex justify-between items-center gap-2">
            <span className="font-head font-black text-[15px] text-brand-deep flex items-center gap-1.5"><Icon n="auto_awesome" fill size={20} />AIのペタまとめ</span>
            <span className="text-[11px] text-mute">ペタ{s.n}枚から</span>
          </div>
          <p className="text-[14px] font-bold leading-relaxed bg-surface rounded-2xl p-3.5">{s.headline}</p>
          {s.keywords.length > 0 && (
            <div className="space-y-2">
              <span className="text-[12px] font-bold text-sub block">よく出た意見</span>
              {s.keywords.map(k => (
                <div key={k.label} className="space-y-1">
                  <div className="flex justify-between text-[12px] font-bold"><span>{k.label}</span><span className="text-sub">{k.count}件</span></div>
                  <div className="h-2 rounded-full bg-surface overflow-hidden"><div className="h-full rounded-full bg-brand animate-grow" style={{ width: `${Math.max(k.pct, 6)}%` }}></div></div>
                </div>
              ))}
            </div>
          )}
          {s.best && (
            <div className="bg-surface rounded-2xl p-3 space-y-1">
              <span className="text-[12px] font-black text-love-ink flex items-center gap-1"><Icon n={post.odai ? "lightbulb" : "favorite"} fill size={14} />{post.odai ? "いちばん「なるほど」が多いペタ" : "いちばん「助かった！」が多いペタ"}</span>
              <p className="text-[13px] leading-relaxed">{s.best.text}</p>
            </div>
          )}
          <div className="flex items-center justify-between gap-2 pt-0.5">
            <button onClick={onJump} className="text-[12px] font-bold text-brand-deep flex items-center gap-0.5 press"><Icon n="arrow_downward" size={15} />元のペタを見る</button>
            <button onClick={onReportSummary} className="text-[12px] font-bold text-mute flex items-center gap-0.5 press"><Icon n="flag" size={14} />要約の誤りを報告</button>
          </div>
          <p className="text-[11px] text-mute">※ AIによる要約です。正確な内容は元のペタを確認してください（デモ：キーワード集計）</p>
        </div>
      );
    }

    // ============================================================
    // 🔐 入口：Google／Appleでサインイン → 大学メールで在学確認（コード6桁）→ 学年を1タップ → ホーム
    //   ・大学はメールのドメインで決まる（ログイン画面では大学名を出さない）
    //   ・大学メールは確認に使うだけで保存しない（大学ID・確認日時・元に戻せない指紋だけを保存）
    //   ・名前・学部・プロフィールは登録しない。学部はあとから任意で設定
    //   ※ デモのため実際のサインイン・メール送信は行いません
    // ============================================================
    // 入口の画面の外枠と進み具合（毎回作り直すと入力中のフォーカスが外れるため、関数の外に置く）
    const GateWrap = ({ children }) => <div className="w-full max-w-md mx-auto min-h-screen bg-bg text-ink flex flex-col px-6 pt-14 pb-10 overflow-x-hidden">{children}</div>;
    const GateSteps = ({ n }) => (
      <div className="flex items-center gap-1.5" aria-label={`3ステップ中${n}`}>
        {[1, 2, 3].map(i => <span key={i} className={cx("h-1.5 rounded-full", i <= n ? "bg-brand w-8" : "bg-line w-5")}></span>)}
      </div>
    );
    function GateScreen({ onEnter }) {
      const [step, setStep] = useState("signin");   // signin → email → code
      const [via, setVia] = useState("mail");        // mail | invite
      const [email, setEmail] = useState("");
      const [invite, setInvite] = useState("");
      const [code, setCode] = useState("");
      const [error, setError] = useState("");
      const domain = (email.split("@")[1] || "").toLowerCase();
      const okDomain = /\.ac\.jp$/.test(domain);
      const sendCode = () => {
        if (via === "mail" && !okDomain) { setError("大学から配られたメールアドレス（〜.ac.jp）を入力してください"); return; }
        if (via === "invite" && invite.trim().length < 6) { setError("招待コードを確認してください"); return; }
        setError(""); setStep("code");
      };
      const points = [
        { icon: "verified_user", title: "大学生だけ" },
        { icon: "visibility_off", title: "名前は出ない" },
        { icon: "volunteer_activism", title: "ずっと無料" }
      ];
      if (step === "signin") return (
        <GateWrap>
          <div className="flex-1 flex flex-col justify-center space-y-7">
            <div className="space-y-4 animate-fade-up">
              <img src={LOGO_MARK} alt="" className="w-14 h-14" />
              <h1 className="font-head font-black text-[28px] leading-tight">大学のことは、<br /><span className="text-brand-deep">先輩に聞こう。</span></h1>
              <p className="text-[13.5px] text-sub leading-relaxed">大学メールで確認した学生だけのQ&Aです。</p>
            </div>
            <div className="grid grid-cols-3 gap-2">
              {points.map((p, i) => (
                <div key={p.icon} className="flex flex-col items-center gap-1.5 bg-surface rounded-3xl py-4 px-1 border border-line/70 animate-fade-up" style={{ animationDelay: `${120 + i * 70}ms` }}>
                  <Icon n={p.icon} fill size={26} className="text-brand" />
                  <p className="font-bold text-[12px] whitespace-nowrap">{p.title}</p>
                </div>
              ))}
            </div>
            <div className="space-y-2.5 animate-fade-up" style={{ animationDelay: "360ms" }}>
              <button onClick={() => setStep("email")} className="w-full bg-surface border border-line rounded-2xl py-3.5 font-black text-[15px] flex items-center justify-center gap-2 press shadow-soft"><span className="font-head text-[18px] text-[#4285F4]">G</span>Googleで続ける</button>
              <button onClick={() => setStep("email")} className="w-full bg-ink text-bg rounded-2xl py-3.5 font-black text-[15px] flex items-center justify-center gap-2 press"><Icon n="phone_iphone" size={20} />Appleで続ける</button>
              <p className="text-[11.5px] text-mute text-center leading-relaxed">デモ版（実際のサインインは行いません）</p>
            </div>
          </div>
        </GateWrap>
      );
      if (step === "email") return (
        <GateWrap>
          <div className="space-y-6 animate-fade-up">
            <GateSteps n={1} />
            <div className="space-y-2">
              <h1 className="font-head font-black text-[24px] leading-tight">大学のメールで、<br />在学を確認します</h1>
              <p className="text-[13px] text-sub leading-relaxed">メールアドレスは確認に使うだけで、保存しません。</p>
            </div>
            {via === "mail" ? (
              <div>
                <label className={LABEL} htmlFor="gate-email">大学から配られたメールアドレス</label>
                <input id="gate-email" type="email" inputMode="email" autoComplete="email" placeholder="例：xxxx@○○.ac.jp" value={email}
                  onChange={(e) => { setEmail(e.target.value); setError(""); }}
                  onKeyDown={(e) => { if (e.key === "Enter" && !e.nativeEvent.isComposing) sendCode(); }} className={INPUT} />
                {okDomain && <p className="text-[13px] font-bold text-brand-deep mt-2 flex items-center gap-1 animate-fade-in"><Icon n="school" fill size={18} />{U.name}として登録します</p>}
              </div>
            ) : (
              <div>
                <label className={LABEL} htmlFor="gate-invite">運営から届いた招待コード</label>
                <input id="gate-invite" value={invite} onChange={(e) => { setInvite(e.target.value); setError(""); }} placeholder="例：TNG-XXXX" className={INPUT} />
                <p className="text-[12px] text-sub mt-1.5">招待コードには大学がひもづいています（デモ：{U.name}）</p>
              </div>
            )}
            {error && <p className="text-[12px] text-danger-ink font-bold">{error}</p>}
            <button onClick={sendCode} className={cx(BTN_PRIMARY, "w-full py-4")}>{via === "mail" ? "確認コードを送る" : "次へ"}</button>
            <button onClick={() => { setVia(via === "mail" ? "invite" : "mail"); setError(""); }} className="w-full text-[12.5px] font-bold text-brand-deep press">{via === "mail" ? "大学のメールがない方（招待コード）" : "大学のメールで確認する"}</button>
          </div>
        </GateWrap>
      );
      return (
        <GateWrap>
          <div className="space-y-6 animate-fade-up">
            <GateSteps n={2} />
            <div className="space-y-2">
              <h1 className="font-head font-black text-[24px] leading-tight">届いた6桁のコードを<br />入力してください</h1>
              <p className="text-[13px] text-sub leading-relaxed">{via === "mail" ? `${email} に送りました。` : "招待コードを確認しました。"}{"\n"}（デモ：6桁なら何でも通ります）</p>
            </div>
            <input id="gate-code" value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 6))} inputMode="numeric" autoComplete="one-time-code" aria-label="確認コード" placeholder="000000"
              className={cx(INPUT, "text-center text-[28px] font-head font-black tracking-[0.4em]")} />
            <button disabled={code.length !== 6} onClick={onEnter} className={cx(BTN_PRIMARY, "w-full py-4")}>確認する</button>
            <button onClick={() => { setStep("email"); setCode(""); }} className="w-full text-[12.5px] font-bold text-brand-deep press">コードが届かない・アドレスを直す</button>
          </div>
        </GateWrap>
      );
    }

    // 学部・学年・表示の設定（マイページの「変更」から）。学部は任意、学年は「答えない」も選べる
    function ProfileForm({ initial, onSave, saveLabel }) {
      const [faculty, setFaculty] = useState(initial.faculty || "");
      const [grade, setGrade] = useState(initial.grade || 0);
      const [showFac, setShowFac] = useState(initial.anonDefault === false);
      const opts = [...GRADES, 0];
      return (
        <div className="space-y-5">
          <div>
            <span className={LABEL}>学年</span>
            <div className="grid grid-cols-3 gap-1.5">
              {opts.map(g => (
                <button key={g} onClick={() => setGrade(g)} aria-pressed={grade === g}
                  className={cx("py-3 rounded-2xl text-[14px] font-black border-[1.5px] press", grade === g ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line")}>{g === 0 ? "答えない" : g === 5 ? "大学院生" : gradeLabel(g)}</button>
              ))}
            </div>
            <p className="text-[11.5px] text-mute mt-1.5">学年に合った質問が「あなた向け」に届きます。毎年4月に自動で上がります</p>
          </div>
          <div>
            <label className={LABEL} htmlFor="pf-fac">学部（任意）</label>
            <select id="pf-fac" value={faculty} onChange={(e) => { setFaculty(e.target.value); if (!e.target.value) setShowFac(false); }} className={cx(INPUT, "font-bold")}>
              <option value="">設定しない</option>
              {U.faculties.map(f => <option key={f}>{f}</option>)}
            </select>
            <p className="text-[11.5px] text-mute mt-1.5">設定すると、同じ学部の質問が届きやすくなります</p>
          </div>
          <label className={cx("flex items-start gap-3 bg-sunk rounded-3xl p-3.5 select-none", faculty ? "cursor-pointer" : "opacity-50")}>
            <input type="checkbox" disabled={!faculty} checked={showFac && !!faculty} onChange={(e) => setShowFac(e.target.checked)} className="mt-1 w-4 h-4 accent-[rgb(var(--brand))]" />
            <span className="leading-relaxed">
              <span className="font-bold text-[14px] block">質問・ペタに学部も表示する</span>
              <span className="text-[12px] text-sub block">ふだんは「匿名・学年」だけ。学部×学年は人数が少なく、人が絞り込まれやすいため最初はオフです</span>
            </span>
          </label>
          <button onClick={() => onSave({ ...initial, faculty, grade, anonDefault: !(showFac && faculty) })} className={cx(BTN_PRIMARY, "w-full py-4")}>{saveLabel}</button>
        </div>
      );
    }

    // はじめての設定：学年を1タップ（入力欄・「次へ」なし）
    function OnboardingScreen({ onDone }) {
      const m = new Date().getMonth() + 1;
      const fresh = m >= 3 && m <= 5;   // 3〜5月は新入生を強調
      const choices = [[1, fresh ? "1年（新入生）" : "1年"], [2, "2年"], [3, "3年"], [4, "4年以上"], [5, "大学院生"]];
      const pick = (g) => onDone({ faculty: "", grade: g, anonDefault: true });
      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-bg text-ink px-6 pt-14 pb-10 space-y-6">
          <div className="space-y-3 animate-fade-up">
            <div className="flex items-center gap-1.5" aria-label="3ステップ中3">{[1, 2, 3].map(i => <span key={i} className="h-1.5 rounded-full bg-brand w-8"></span>)}</div>
            <p className="text-[12.5px] font-bold text-brand-deep flex items-center gap-1"><Icon n="verified" fill size={16} />{U.name}の学生として確認しました</p>
            <h1 className="font-head font-black text-[26px] leading-tight">いま何年生？</h1>
            <p className="text-[13px] text-sub leading-relaxed">名前や学部は登録しません。</p>
          </div>
          <div className="grid grid-cols-2 gap-2.5 animate-fade-up" style={{ animationDelay: "100ms" }}>
            {choices.map(([g, l], i) => (
              <button key={g} onClick={() => pick(g)} className={cx("rounded-3xl py-5 font-head font-black text-[18px] press border-[1.5px]", i === 0 ? "col-span-2 bg-brand text-on-brand border-brand shadow-soft" : "bg-surface border-line")}>{l}</button>
            ))}
            <button onClick={() => pick(0)} className="col-span-2 text-[13px] font-bold text-sub py-2.5 press">答えない</button>
          </div>
          <p className="text-[11.5px] text-mute text-center">あとからマイページで変えられます</p>
        </div>
      );
    }

    // ============================================================
    // ✍️ 投稿する（質問する／人を集める／知恵を残す の3つを1行ずつ）
    //   ・質問は1つの画面：まず話題を選ぶ → 話題に合った「書き方の例」が出る → 例を押して書きかえる／例を見て自分で書く
    //     （話題を選ばずに書いた場合は、書いた文から話題を自動で選ぶ）
    //   ・旧：テンプレート7つから選ぶ形（選ぶ＝実質カテゴリ選びで、投稿メニューの形もそろっていなかった）
    // ============================================================
    const Q_SUGGEST = {
      "授業・過去問": ["【授業名】のテストの難しさを教えてください", "【授業名】の過去問や出題傾向を知っている人いますか？", "【授業名】の課題の量や先生の雰囲気はどうですか？"],
      "履修・楽単": ["【曜日・時限】で取れるおすすめの授業はありますか？", "レポートだけで評価される教養科目を知りたいです", "履修を決めるとき、何を基準に選びましたか？"],
      "ゼミ・研究室": ["【ゼミ名】の雰囲気や活動の頻度を知りたいです", "ゼミ・研究室選びで、見ておけばよかったことは？"],
      "就活・インターン": ["インターンはいつから準備しましたか？", "ガクチカはどうやって作りましたか？", "ESで気をつけたことを教えてください"],
      "生活ハック": ["【テーマ】のコツを教えてください", "教授へのメールの書き方のコツは？", "テスト勉強の計画、どう立てていますか？"],
      "新歓・サークル": ["後期からでも入りやすいサークルはありますか？", "【サークル名】の活動頻度や費用を知りたいです"],
      "暮らし・通学": [`${U.winter}、みんなどうしてる？`, "一人暮らしで買ってよかったもの・いらなかったものは？"],
      "その他": ["【聞きたいこと】について、経験のある人いますか？"]
    };
    const Q_PLACEHOLDER = /【(授業名|曜日・時限|ゼミ名|テーマ|サークル名|聞きたいこと)】/;
    // 書いた文から話題を推測（本番はAIで判定する想定）
    const Q_GUESS = [
      ["授業・過去問", /過去問|テスト|試験|授業|講義|課題|先生|教授|単位/],
      ["履修・楽単", /履修|楽単|時間割|教養/],
      ["ゼミ・研究室", /ゼミ|研究室/],
      ["就活・インターン", /就活|インターン|ES|ガクチカ|企業/],
      ["新歓・サークル", /サークル|部活|新歓/],
      ["暮らし・通学", /一人暮らし|家賃|通学|雪|バス|自転車|自炊|引っ越/],
      ["生活ハック", /コツ|勉強法|メール|レポート|朝|起き/]
    ];
    const guessCategory = (t) => { const hit = Q_GUESS.find(([, re]) => re.test(t)); return hit ? hit[0] : ""; };
    const Q_EXAMPLE = { "前期": "例：履修登録、みんな何を参考にした？", "後期": "例：期末テストの過去問、どこで手に入る？" };

    const StepNum = ({ n }) => <span className="w-[18px] h-[18px] rounded-full bg-brand text-on-brand text-[11px] font-black inline-flex items-center justify-center">{n}</span>;

    function AskSheet({ me, posts, courseDict = [], preset, context = "home", onClose, onSubmit, onJoin, onOpenPost, onCreateEvent, onShareKakomon }) {
      const [mode, setMode] = useState(preset && (preset.cat || preset.text) ? "question" : "menu");
      const [text, setText] = useState((preset && preset.text) || "");
      const [catManual, setCatManual] = useState((preset && preset.cat && preset.cat !== "運営のお題") ? preset.cat : "");
      const [askTo, setAskTo] = useState("senpai");
      const [detail, setDetail] = useState("");
      const [anon, setAnon] = useState(me.anonDefault);
      const [joinTarget, setJoinTarget] = useState(null);
      const [joinNote, setJoinNote] = useState("");
      const textRef = useRef(null);
      const courseRef = useRef(null);
      const [course, setCourse] = useState("");

      const title = text.trim();
      const autoCat = guessCategory(title);
      const category = catManual || autoCat;
      const hasBlank = Q_PLACEHOLDER.test(title);
      const needsCourse = text.includes("【授業名】");                 // 例文の【授業名】を、候補から選んで埋める
      const showCourse = needsCourse || category === "授業・過去問";   // 授業の質問は授業名を付けると過去問とつながる
      const pickCourse = (name) => {
        setCourse(name);
        if (needsCourse) setText(t => t.replace("【授業名】", name));
      };
      const finalCourse = (() => { const v = course.trim(); if (!v || needsCourse) return ""; const hit = courseDict.find(c => c.norm === normCourse(v)); return hit ? hit.name : v; })();
      const ready = title.length >= 5 && !!category && !hasBlank;
      const similar = useMemo(() => (title.length >= 5 && !hasBlank ? findSimilarQuestions(posts, title, category) : []), [title, category, posts, hasBlank]);
      const term = autoTerm();

      // 書き方の例を入れたら、最初の【 】を選んだ状態にする（そのまま打てば置きかわる）
      const useSuggest = (s) => {
        setText(s);
        setTimeout(() => {
          const el = textRef.current; if (!el) return;
          const m = s.match(Q_PLACEHOLDER);
          if (m && m[0] === "【授業名】" && courseRef.current) { setCourse(""); courseRef.current.focus(); return; }
          el.focus();
          if (m) el.setSelectionRange(m.index, m.index + m[0].length);
        }, 0);
      };

      if (mode === "menu") {
        const row = (key, title, icon, x, top) => (
          <section key={key} className="space-y-2">
            <button onClick={x.onClick} className={cx("w-full text-left rounded-2xl px-3.5 py-3 flex items-center gap-3 press", top ? "bg-brand-tint border-[1.5px] border-brand" : "bg-surface border border-line")}>
              <span className={cx("w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0", top ? "bg-brand text-on-brand" : "bg-sunk text-brand-deep")}><Icon n={x.icon} fill size={20} /></span>
              <span className="flex-1 min-w-0">
                <span className="block font-bold text-[14px]">{x.label}</span>
                <span className="block text-[11.5px] text-sub leading-snug">{x.sub}</span>
              </span>
              <Icon n="chevron_right" className={top ? "text-brand-deep" : "text-mute"} />
            </button>
          </section>
        );
        const q = (top) => row("q", "質問する", "help", { icon: "help", label: "先輩に質問する", sub: "書き方の例があります", onClick: () => setMode("question") }, top);
        const g = (top) => row("g", "人を集める", "diversity_3", { icon: "diversity_3", label: "仲間を募集・イベントを作る", sub: "勉強仲間・イベント", onClick: onCreateEvent }, top);
        const w = (top) => row("w", "知恵を残す", "upload_file", { icon: "upload_file", label: "過去問・傾向メモを共有する", sub: `閲覧チケット+${TICKET_RULES.share}枚`, onClick: onShareKakomon }, top);
        // 開いた画面に合う項目を一番上に（ホーム＝質問／過去問タブ＝共有／仲間・イベント＝募集・イベント）
        const order = context === "kakomon" ? [w(true), q(false), g(false)] : context === "gather" ? [g(true), q(false), w(false)] : [q(true), g(false), w(false)];
        return (
          <Sheet onClose={onClose}>
            <SheetHeader title="投稿する" icon="add_circle" onClose={onClose} />
            <div className="px-5 pb-6 pt-1 overflow-y-auto space-y-2.5">{order}</div>
          </Sheet>
        );
      }

      return (
        <Sheet onClose={onClose}>
          <SheetHeader title="先輩に質問する" icon="help" onBack={() => setMode("menu")} onClose={onClose} />
          <div className="px-5 pb-4 pt-1 overflow-y-auto space-y-4 flex-1">
            {/* ① 話題を選ぶ（先に選ぶと、その話題の書き方の例が出る） */}
            <div>
              <div className="flex items-baseline justify-between gap-2">
                <span className={cx(LABEL, "flex items-center gap-1.5")}><StepNum n={1} />話題を選ぶ</span>
                {category && <span className="text-[11px] text-mute text-right">{catManual ? "" : "書いた内容から自動で選びました・"}「{catMeta(category).short}」に表示されます</span>}
              </div>
              <div className="flex flex-wrap gap-1.5">
                {CATEGORIES.filter(c => c.key !== "運営のお題").map(c => (
                  <button key={c.key} type="button" onClick={() => setCatManual(catManual === c.key ? "" : c.key)} aria-pressed={category === c.key}
                    className={cx("text-[12.5px] font-bold px-3 py-1.5 rounded-full press border flex items-center gap-1", category === c.key ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line")}>
                    <Icon n={c.icon} fill={category === c.key} size={15} />{c.short}
                  </button>
                ))}
              </div>
            </div>

            {/* ② 書き方の例（話題を選ぶと出る。押すと「聞きたいこと」に入る。見るだけでもOK） */}
            {category && Q_SUGGEST[category] ? (
              <div className="bg-sunk rounded-3xl p-3.5 space-y-2 animate-fade-in">
                <p className="text-[12px] font-black text-sub flex items-center gap-1"><Icon n="lightbulb" fill size={15} className="text-brand-deep" />「{catMeta(category).short}」の書き方の例（押すと下に入ります）</p>
                {Q_SUGGEST[category].map(s => (
                  <button key={s} type="button" onClick={() => useSuggest(s)} className="w-full text-left bg-surface rounded-2xl px-3 py-2.5 text-[13.5px] font-bold leading-snug press border border-line/70 flex gap-1.5">
                    <span className="text-brand font-black">Q.</span>
                    <span>{s.split(/(【[^】]+】)/).map((part, i) => Q_PLACEHOLDER.test(part) ? <span key={i} className="text-brand-deep bg-brand-tint rounded px-0.5">{part}</span> : part)}</span>
                  </button>
                ))}
              </div>
            ) : (
              <p className="text-[12px] text-mute flex items-center gap-1 -mt-1"><Icon n="lightbulb" size={15} />話題を選ぶと、先輩に伝わりやすい書き方の例が出ます</p>
            )}

            {/* ③ 聞きたいこと（例を押して書きかえても、例を見て自分で書いてもOK） */}
            <div>
              <label className={cx(LABEL, "flex items-center gap-1.5")} htmlFor="ask-text"><StepNum n={2} />聞きたいことを書く</label>
              <textarea id="ask-text" ref={textRef} rows={2} value={text} onChange={(e) => setText(e.target.value)}
                placeholder={category ? "上の例を押して書きかえるか、自由に書いてください" : Q_EXAMPLE[term]}
                className={cx(INPUT, "leading-relaxed text-[15px] font-bold")} />
              {hasBlank && !needsCourse && <p className="text-[12px] font-bold text-danger-ink mt-1.5 flex items-center gap-1"><Icon n="edit" size={14} />【 】の部分を書きかえてください</p>}
            </div>

            {/* 授業名（候補から選ぶと表記がそろう。例文の【授業名】もここで埋める） */}
            {showCourse && (
              <div className={cx(needsCourse && "bg-brand-tint/50 rounded-3xl p-3 -mx-1")}>
                <label className={LABEL} htmlFor="ask-course">{needsCourse ? "【授業名】に入る授業" : "どの授業？（任意・同じ授業の過去問とつながります）"}</label>
                <CourseInput id="ask-course" dict={courseDict} inputRef={courseRef} value={course} onChange={setCourse} onPick={pickCourse}
                  placeholder={`授業名を入れる（例：${U.courseA}）`} newLabel={needsCourse ? "を入れる" : ""} />
                {needsCourse && <p className="text-[11.5px] text-sub mt-1.5">候補から選ぶと、上の【授業名】に入ります</p>}
              </div>
            )}

            {/* 🔗 似ている質問（合流するかは自分で決める） */}
            {similar.length > 0 && (
              <div className="bg-brand-tint/60 rounded-3xl p-3.5 space-y-2.5 animate-fade-up">
                <div>
                  <p className="text-[13.5px] font-black text-brand-deep flex items-center gap-1"><Icon n="group_add" size={18} />似ている質問があります</p>
                  <p className="text-[12px] text-sub leading-relaxed mt-0.5">同じ内容なら、一緒にペタを待てます。ペタが届くとあなたにもお知らせします。</p>
                </div>
                {similar.map(p => {
                  const joined = p.joiners.some(j => j.mine);
                  const solved = p.bestAnswerId || p.closed;
                  return (
                    <div key={p.id} className="bg-surface rounded-2xl border border-line/70 p-3 space-y-2.5">
                      <button type="button" onClick={() => onOpenPost(p.id)} className="text-left w-full press">
                        <span className="flex gap-1.5"><span className="font-head font-black text-[15px] text-brand">Q.</span><span className="font-bold text-[14px] leading-snug line-clamp-2">{plainTitle(p.title)}</span></span>
                        <span className="flex flex-wrap items-center gap-x-2.5 gap-y-1 mt-1.5 text-[11.5px] text-mute">
                          {solved ? <SolvedBadge /> : <span className={p.comments.length ? "" : "font-bold text-brand-deep"}>{p.comments.length ? `ペタ ${p.comments.length}枚` : "ペタ募集中"}</span>}
                          {p.joiners.length > 0 && <span className="font-bold text-brand-deep flex items-center gap-0.5"><Icon n="group" size={14} />同じ疑問 {p.joiners.length}人</span>}
                        </span>
                      </button>
                      {solved ? (
                        <button type="button" onClick={() => onOpenPost(p.id)} className={cx(BTN_SOFT, "w-full text-[13px] py-2.5")}>答えを見る</button>
                      ) : joined ? (
                        <p className="text-[12.5px] font-bold text-brand-deep flex items-center gap-1"><Icon n="check_circle" fill size={16} />一緒にペタを待っています</p>
                      ) : joinTarget === p.id ? (
                        <div className="space-y-2">
                          <label className={LABEL}>あなたの条件をひとこと（任意）</label>
                          <textarea rows={2} value={joinNote} onChange={(e) => setJoinNote(e.target.value)} placeholder="例：2限も空いています" className={cx(INPUT, "text-[13.5px] py-2.5")} />
                          <div className="flex gap-2">
                            <button type="button" onClick={() => setJoinTarget(null)} className={cx(BTN_SOFT, "flex-1 text-[13px] py-2.5")}>やめる</button>
                            <button type="button" onClick={() => onJoin(p.id, joinNote.trim(), anon)} className={cx(BTN_PRIMARY, "flex-[2] text-[13.5px] py-2.5")}>一緒に待つ</button>
                          </div>
                        </div>
                      ) : (
                        <button type="button" onClick={() => { setJoinTarget(p.id); setJoinNote(detail.trim()); }} className="w-full bg-brand text-on-brand font-black rounded-2xl py-2.5 text-[13.5px] press flex items-center justify-center gap-1">
                          <Icon n="group_add" size={18} />この質問と一緒にペタを待つ
                        </button>
                      )}
                    </div>
                  );
                })}
                <p className="text-[11.5px] text-sub">状況がちがうときは、このまま新しく質問できます。</p>
              </div>
            )}

            <div>
              <span className={LABEL}>だれに聞きたい？</span>
              <div className="grid grid-cols-3 gap-1.5">
                {ASK_TO.map(a => (
                  <button key={a.v} onClick={() => setAskTo(a.v)} aria-pressed={askTo === a.v}
                    className={cx("py-2.5 rounded-2xl text-[13px] font-bold border-[1.5px] flex items-center justify-center gap-1 press", askTo === a.v ? "bg-brand-tint text-brand-deep border-brand" : "bg-surface text-sub border-line")}>
                    <Icon n={a.icon} fill={askTo === a.v} size={17} />{a.label}
                  </button>
                ))}
              </div>
            </div>

            <div>
              <div className="flex items-baseline justify-between">
                <label className={LABEL} htmlFor="ask-detail">くわしい状況（任意）</label>
                {!detail && <button type="button" onClick={() => setDetail("・今の状況：\n・知りたいこと：")} className="text-[12px] font-bold text-brand-deep press">型を入れる</button>}
              </div>
              <textarea id="ask-detail" rows={3} value={detail} onChange={(e) => setDetail(e.target.value)} placeholder="状況を少し書くと、答えてもらいやすくなります" className={cx(INPUT, "leading-relaxed")} />
            </div>

            <label className="flex items-start gap-3 bg-sunk rounded-3xl p-3.5 cursor-pointer select-none">
              <input type="checkbox" checked={anon} onChange={(e) => setAnon(e.target.checked)} className="mt-1 w-4 h-4 accent-[rgb(var(--brand))]" />
              <span className="leading-relaxed">
                <span className="font-bold text-[14px] block">匿名で質問する</span>
                <span className="text-[12px] text-sub block">表示：{displayName({ fac: facShort(me.faculty), grade: me.grade, anon })}</span>
              </span>
            </label>
            <p className="text-[12px] text-mute">※ 個人の特定・悪口はNG。<span className="font-bold">質問はずっと無料</span>です。</p>
          </div>
          <div className="px-4 pt-3 pb-4 border-t border-line space-y-1.5">
            {!ready && title.length > 0 && !hasBlank && !category && <p className="text-[12px] text-sub text-center">話題を1つ選んでください</p>}
            <button disabled={!ready} onClick={() => onSubmit({ title, category, askTo, content: detail.trim(), anon, course: finalCourse })} className={cx(BTN_PRIMARY, "w-full")}>質問する</button>
          </div>
        </Sheet>
      );
    }

    // ============================================================
    // 💬 質問の詳細（回答・助かった！・いちばん助かった・AI要約・通報）
    // ============================================================
    function PostDetailSheet({ post, me, reported, kakomonCount, myPetaName, firstPeta = false, onOpenUser = () => {}, onClose, onWatch, onAnswer, onThanks, onPickBest, onCloseRecruit, onReport, onDemoAnswer, onOpenKakomon }) {
      const [input, setInput] = useState("");
      const [anon, setAnon] = useState(me.anonDefault);
      const [showAll, setShowAll] = useState(false);
      const [order, setOrder] = useState("top");
      const [oOrder, setOOrder] = useState("top");   // top＝反応の多い順（いちばん助かったは常に先頭）／new＝新しい順
      const [baTarget, setBaTarget] = useState(null);
      const [baMsg, setBaMsg] = useState("");
      const answersRef = useRef(null);
      const mine = post.author.mine;
      const recruit = post.category === "仲間募集";
      const odai = !!post.odai;
      const solved = !!post.bestAnswerId || post.closed;
      const answeredByMe = post.comments.some(c => c.user.mine);
      const sorted = [...post.comments].sort((a, b) => ((b.id === post.bestAnswerId) - (a.id === post.bestAnswerId)) || (order === "new" ? b.at - a.at : (b.thanks || 0) - (a.thanks || 0)));
      const visible = showAll ? sorted : sorted.slice(0, 5);
      const send = () => { const t = input.trim(); if (!t) return; onAnswer(post.id, t, anon); setInput(""); };
      const kCount = post.course ? kakomonCount(post.course) : 0;

      return (
        <Sheet onClose={onClose}>
          <div className="px-5 py-2 flex justify-between items-center gap-2">
            <div className="flex items-center gap-2.5 min-w-0">
              <Avatar user={post.author} size={36} />
              <div className="min-w-0">
                <div className="text-[13px] font-bold truncate">{mine ? "あなた" : displayName(post.author)}<span className="text-mute font-normal">・{agoLabel(post.at)}</span></div>
                <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                  {mine && <MineBadge />}
                  {solved && <SolvedBadge recruit={recruit} />}
                  <CategoryChip cat={post.category} />
                  <AskToBadge v={post.askTo} />
                </div>
              </div>
            </div>
            <div className="flex items-center gap-1 flex-shrink-0">
              {!mine && !odai && <button onClick={() => onReport({ postId: post.id })} className="text-mute px-2 h-9 rounded-full flex items-center gap-0.5 text-[12px] font-bold press"><Icon n="flag" size={18} />通報</button>}
              <button onClick={onClose} aria-label="閉じる" className="w-9 h-9 rounded-full bg-sunk text-sub flex items-center justify-center press"><Icon n="close" size={20} /></button>
            </div>
          </div>

          <div className="px-5 pb-4 pt-2 overflow-y-auto space-y-4 flex-1">
            <h2 className="font-head font-black text-[20px] leading-snug">{plainTitle(post.title)}</h2>
            {post.content && <p className="text-[14px] text-sub leading-relaxed break-words whitespace-pre-wrap">{post.content}</p>}
            {odai && (
              <div className="bg-brand-tint rounded-2xl px-3.5 py-2.5 text-[12px] leading-relaxed flex gap-2 items-start">
                <Icon n="campaign" fill size={16} className="text-brand-deep flex-shrink-0 mt-0.5" />
                <span>{post.odai.kind === "知恵" ? <b className="text-brand-deep">{post.odai.to}の経験を募集中</b> : <b className="text-brand-deep">息抜きのお題・だれでもOK</b>}{post.odai.migrated && "（ペタり場から移行）"}</span>
              </div>
            )}

            {post.joiners.length > 0 && (
              <div className="bg-sunk rounded-3xl p-3.5 space-y-2">
                <p className="text-[13px] font-black flex items-center gap-1"><Icon n="group" size={18} className="text-brand-deep" />同じ疑問の人 {post.joiners.length}人</p>
                <p className="text-[12px] text-sub leading-relaxed">{solved ? "ほかの人も一緒にペタを待っていました。" : `ペタると、質問した人とこの${post.joiners.length}人全員に届きます。`}</p>
                {post.joiners.filter(j => j.note).map(j => (
                  <div key={j.id} className="bg-surface rounded-2xl px-3 py-2">
                    <span className="text-[11.5px] font-bold text-mute">{j.mine ? "あなた" : displayName(j.who)}の条件</span>
                    <p className="text-[13px] leading-relaxed break-words">{j.note}</p>
                  </div>
                ))}
              </div>
            )}

            {kCount > 0 && (
              <button onClick={() => onOpenKakomon(post.course)} className="w-full text-left bg-brand-tint rounded-3xl p-3.5 flex items-center gap-3 press">
                <span className="w-10 h-10 rounded-2xl bg-surface text-brand-deep flex items-center justify-center flex-shrink-0"><Icon n="description" fill size={22} /></span>
                <span className="flex-1 min-w-0">
                  <span className="block font-black text-[14px] text-brand-deep">【{post.course}】の過去問 {kCount}件</span>
                  <span className="block text-[12px] text-sub">閲覧チケットで見られます</span>
                </span>
                <Icon n="chevron_right" className="text-brand-deep" />
              </button>
            )}

            <div className="flex justify-between items-center pt-3 border-t border-line">
              <span className="text-mute text-[12px] flex items-center gap-1"><Icon n="visibility" size={15} />{post.views}</span>
              {!mine && (
                <button onClick={() => onWatch(post.id)} aria-pressed={post.watched}
                  className={cx("flex items-center gap-1.5 px-4 py-2 rounded-full font-black text-[14px] press", post.watched ? "bg-love text-white shadow-soft" : "bg-surface border border-line text-ink")}>
                  <Icon n="bookmark" fill={post.watched} size={18} /><span>気になる {post.watchers}</span>
                </button>
              )}
            </div>

            <div className="pt-3 border-t border-line space-y-3" ref={answersRef}>
              {!recruit && (!odai || post.odai.kind === "知恵") && post.comments.length >= SUMMARY_MIN_ANSWERS && (
                <AnswerSummary post={post}
                  onJump={() => { const el = document.getElementById("answer-list"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }}
                  onReportSummary={() => onReport({ postId: post.id, summary: true })} />
              )}
              <div className="flex items-center justify-between gap-2 scroll-mt-4" id="answer-list">
                <h3 className="font-head font-black text-[16px]">
                {recruit ? `参加希望・返信 (${post.comments.length}件)` : odai ? `みんなのペタ（${post.comments.length}枚）` : `ペタ（${post.comments.length}枚）`}
              </h3>
                {!recruit && post.comments.length > 1 && <SortToggle value={odai ? oOrder : order} onChange={odai ? setOOrder : setOrder} topLabel={odai ? "なるほど順" : "助かった！順"} />}
              </div>
              {mine && !solved && !recruit && post.comments.some(c => !c.user.mine) && (
                <div className="bg-brand-tint rounded-2xl px-3.5 py-3 text-[12.5px] text-brand-deep font-bold flex items-start gap-2">
                  <Icon n="workspace_premium" fill size={18} className="flex-shrink-0" />
                  <span>いちばん助かったペタを1つ選ぶと解決済みになり、ペタした人に閲覧チケット+{TICKET_RULES.best}枚が届きます</span>
                </div>
              )}
              {mine && recruit && !post.closed && post.comments.length > 0 && (
                <button onClick={() => onCloseRecruit(post.id)} className={cx(BTN_SOFT, "w-full text-[13px]")}>メンバーが集まったので募集を締め切る</button>
              )}

              {odai ? <OdaiAnswers post={post} order={oOrder} reported={reported} myPetaName={myPetaName} onThanks={onThanks} onReport={onReport} onOpenUser={onOpenUser} /> : <div className="space-y-2.5">
                {sorted.length === 0 ? (
                  <div className="text-center py-3 space-y-2.5">
                    <p className="text-mute text-[13px]">{recruit ? "まだ返信はありません" : "まだペタがありません"}</p>
                    {mine && <button onClick={() => onDemoAnswer(post.id)} className="bg-sunk text-ink font-bold text-[13px] px-4 py-2 rounded-xl press">サンプルのペタを追加（デモ）</button>}
                  </div>
                ) : (
                  <>
                    {visible.map((c, idx) => {
                      if (reported.includes(`c:${post.id}:${c.id}`)) return <div key={c.id} className="bg-sunk p-3 rounded-2xl text-[12px] text-mute">通報済みのため、このペタは非表示にしています。</div>;
                      const isBA = post.bestAnswerId === c.id;
                      const cMine = c.user.mine;
                      const topThanks = !recruit && !post.bestAnswerId && idx === 0 && (c.thanks || 0) > 0 && sorted.length > 1;
                      const canPick = mine && !solved && !recruit && !cMine;
                      return (
                        <div key={c.id} className={cx("p-3.5 rounded-3xl space-y-2 animate-fade-up", isBA ? "bg-[rgb(var(--peta))] border-2 border-brand" : cMine ? "bg-brand-tint/60 border border-brand/40" : "bg-[rgb(var(--peta))]")}>
                          {isBA && <span className="inline-flex items-center gap-1 bg-brand text-on-brand text-[12px] font-black px-2.5 py-0.5 rounded-full"><Icon n="workspace_premium" fill size={14} />いちばん助かった</span>}
                          {topThanks && <span className="inline-flex items-center gap-1 text-love-ink text-[12px] font-black"><Icon n="favorite" fill size={14} />いちばん助かった！が多い</span>}
                          <button type="button" onClick={() => onOpenUser(c.user)} aria-label={`${cMine ? "あなた" : displayName(c.user)}のペタ数と助かった！の数を見る`} className="w-full flex items-center gap-2 text-left press">
                            <Avatar user={c.user} size={28} />
                            <span className="text-[13px] font-bold min-w-0 truncate">{cMine ? <MineBadge type="answer" /> : displayName(c.user)}</span>
                            <Icon n="chevron_right" size={16} className="text-mute -ml-1 flex-shrink-0" />
                            <span className="flex-1"></span>
                            <span className="text-mute text-[12px]">{agoLabel(c.at)}</span>
                          </button>
                          <p className="text-[14px] leading-relaxed break-words whitespace-pre-wrap">{c.text}</p>
                          {isBA && post.bestThanks && (
                            <div className="bg-brand-tint rounded-2xl px-3 py-2.5 text-[13px] leading-relaxed"><span className="block text-[11px] font-black text-brand-deep mb-0.5">質問した人からのお礼</span>{post.bestThanks}</div>
                          )}
                          {canPick && (
                            <button onClick={() => { setBaMsg(""); setBaTarget(c); }} className="w-full border-[1.5px] border-brand text-brand-deep font-black text-[13px] py-2 rounded-2xl flex items-center justify-center gap-1 press">
                              <Icon n="workspace_premium" size={17} />「いちばん助かった」に選ぶ
                            </button>
                          )}
                          <div className="flex justify-between items-center">
                            <button onClick={() => onThanks(post.id, c.id)} disabled={cMine}
                              className={cx("flex items-center gap-1 px-3 py-1 rounded-full font-black text-[12px] press", c.liked ? "bg-love text-white" : cMine ? "text-mute" : "bg-surface border border-line text-ink")}>
                              <Icon n="favorite" fill={c.liked} size={15} /><span>助かった！ {c.thanks || 0}</span>
                            </button>
                            {!cMine && <button onClick={() => onReport({ postId: post.id, commentId: c.id })} className="text-mute flex items-center gap-0.5 text-[12px] font-bold press"><Icon n="flag" size={15} />通報</button>}
                          </div>
                        </div>
                      );
                    })}
                    {!showAll && sorted.length > visible.length && (
                      <button onClick={() => setShowAll(true)} className={cx(BTN_SOFT, "w-full")}>すべてのペタを見る（{sorted.length}枚）</button>
                    )}
                  </>
                )}
              </div>}
            </div>
          </div>

          {solved ? (
            <div className="px-4 pt-3 pb-4 border-t border-line bg-surface text-center text-[13px] text-sub font-bold flex items-center justify-center gap-1.5">
              <Icon n="check_circle" fill size={18} className="text-brand" />{recruit ? "募集は締め切られました" : "解決済みのため、ペタの受付は終了しました"}
            </div>
          ) : mine ? null : (
            <div className="px-4 pt-2.5 pb-3.5 border-t border-line bg-surface space-y-1.5">
              {/* はじめてペタる人にだけ、言葉の意味を1回案内 */}
              {firstPeta && !recruit && <p className="text-[12px] bg-brand-tint text-brand-deep rounded-xl px-3 py-2 leading-relaxed"><b>ペタ＝回答。</b>気軽に本音をどうぞ</p>}
              <div className="flex items-center justify-between text-[12px]">
                <span className={cx("font-bold flex items-center gap-1", anon ? "text-brand-deep" : "text-sub")}><Icon n="visibility_off" fill={anon} size={14} />{anon ? "匿名" : "学部・学年"}で送信：{displayName({ fac: facShort(me.faculty), grade: me.grade, anon })}</span>
                {!answeredByMe && !recruit && <span className="font-black text-brand-deep flex items-center gap-0.5"><Icon n="confirmation_number" fill size={14} />ペタると閲覧チケット+{TICKET_RULES.answer}</span>}
              </div>
              <div className="flex gap-2 items-center">
                <button onClick={() => setAnon(!anon)} aria-pressed={anon} aria-label="匿名で送る（学部は非表示）"
                  className={cx("w-11 h-11 rounded-full flex items-center justify-center flex-shrink-0 press", anon ? "bg-brand text-on-brand" : "bg-sunk text-sub")}>
                  <Icon n="visibility_off" fill={anon} size={22} />
                </button>
                <input type="text" value={input} onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && !e.nativeEvent.isComposing) send(); }}
                  placeholder={recruit ? "参加したい！ひとこと…" : odai ? "あなたの答えをペタる…" : "あなたの経験を教えてください…"} className={cx(INPUT, "flex-1 min-w-0 rounded-full")} />
                <button onClick={send} disabled={!input.trim()} className="bg-brand text-on-brand font-black px-4 h-11 rounded-full text-[14px] shadow-soft press flex-shrink-0 disabled:opacity-50">{recruit ? "返信" : odai ? "ペタる" : "ペタる"}</button>
              </div>
            </div>
          )}

          {baTarget && (
            <Dialog onClose={() => setBaTarget(null)}>
              <div className="p-5 space-y-4">
                <div className="text-center space-y-1">
                  <Icon n="workspace_premium" fill size={40} className="text-brand" />
                  <h3 className="font-head font-black text-[17px]">このペタを「いちばん助かった」に選びますか？</h3>
                  <p className="text-[12.5px] text-sub">質問は解決済みになり、ペタの受付を終了します</p>
                </div>
                <p className="bg-sunk rounded-2xl p-3 text-[13px] leading-relaxed">{baTarget.text}</p>
                <div>
                  <label className={LABEL} htmlFor="ba-thanks">お礼のひとこと（任意）</label>
                  <input id="ba-thanks" type="text" value={baMsg} onChange={(e) => setBaMsg(e.target.value)} placeholder="例：とても参考になりました！" className={INPUT} />
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setBaTarget(null)} className={cx(BTN_SOFT, "flex-1")}>やめる</button>
                  <button onClick={() => { onPickBest(post.id, baTarget.id, baMsg.trim()); setBaTarget(null); }} className={cx(BTN_PRIMARY, "flex-[2] text-[14px]")}>選ぶ</button>
                </div>
              </div>
            </Dialog>
          )}
        </Sheet>
      );
    }

    // 並び順の切り替え（Q&Aとお題で共通）
    function SortToggle({ value, onChange, topLabel }) {
      return (
        <div className="flex gap-0.5 bg-sunk rounded-full p-0.5 flex-shrink-0" role="tablist" aria-label="並び順">
          {[["top", topLabel], ["new", "新しい順"]].map(([v, l]) => (
            <button key={v} role="tab" aria-selected={value === v} onClick={() => onChange(v)}
              className={cx("text-[11.5px] font-bold px-2.5 py-1 rounded-full press", value === v ? "bg-surface text-ink shadow-soft" : "text-sub")}>{l}</button>
          ))}
        </div>
      );
    }

    // 📣 運営のお題への回答
    //   ・見せ方はQ&Aの回答と同じ縦1列に統一（11/2決定）。ペタらしさは左端の付せん色の帯とアイコンで残す
    //   ・反応は「なるほど」1つ（質問への回答は「助かった！」）。既存ペタは「なるほど」の数だけ移す
    const NOTE_STRIPES = ["border-l-[#7fa6ef]", "border-l-[#ef95bb]", "border-l-[#7fcf93]", "border-l-[#e6cc55]"];
    function OdaiAnswers({ post, order, reported, myPetaName, onThanks, onReport, onOpenUser = () => {} }) {
      const [showAll, setShowAll] = useState(false);
      const list = [...post.comments].sort((a, b) => order === "new" ? b.at - a.at : (b.thanks || 0) - (a.thanks || 0));
      const visible = showAll ? list : list.slice(0, 5);
      if (list.length === 0) return <p className="text-center text-mute text-[13px] py-3">最初の1枚をペタってみよう</p>;
      return (
        <div className="space-y-2.5">
          {visible.map((c, idx) => {
            if (reported.includes(`c:${post.id}:${c.id}`)) return <div key={c.id} className="bg-sunk p-3 rounded-2xl text-[12px] text-mute">通報済みのため、このペタは非表示にしています。</div>;
            const mine = c.user.mine;
            const top = order === "top" && idx === 0 && (c.thanks || 0) > 0 && list.length > 1;
            return (
              <div key={c.id} className={cx("p-3.5 rounded-3xl space-y-2 animate-fade-up", mine ? "bg-brand-tint/60 border border-brand/40" : "bg-[rgb(var(--peta))]")}>
                {top && <span className="inline-flex items-center gap-1 text-brand-deep text-[12px] font-black"><Icon n="lightbulb" fill size={14} />いちばん「なるほど」が多い</span>}
                <button type="button" onClick={() => onOpenUser(c.user)} aria-label={`${mine ? "あなた" : displayName(c.user)}のペタ数と助かった！の数を見る`} className="w-full flex items-center gap-2 text-left press">
                  <Avatar user={c.user} size={28} />
                  <span className="text-[13px] font-bold min-w-0 truncate">{mine ? <MineBadge type="answer" /> : displayName(c.user)}</span>
                  <Icon n="chevron_right" size={16} className="text-mute -ml-1 flex-shrink-0" />
                  <span className="flex-1"></span>
                  <span className="text-mute text-[12px] flex items-center gap-0.5"><Icon n="sticky_note_2" size={14} />{agoLabel(c.at)}</span>
                </button>
                <p className="text-[14px] leading-relaxed break-words whitespace-pre-wrap">{c.text}</p>
                {mine && c.migrated && <p className="text-[11.5px] text-sub">ペタり場から移行／ほかの人には「{myPetaName}」と表示</p>}
                <div className="flex justify-between items-center">
                  <button onClick={() => onThanks(post.id, c.id)} disabled={mine} aria-pressed={!!c.liked}
                    className={cx("flex items-center gap-1 px-3 py-1 rounded-full font-black text-[12px] press", c.liked ? "bg-brand text-on-brand" : mine ? "text-mute" : "bg-surface border border-line text-ink")}>
                    <Icon n="lightbulb" fill={!!c.liked} size={15} /><span>なるほど {c.thanks || 0}</span>
                  </button>
                  {!mine && <button onClick={() => onReport({ postId: post.id, commentId: c.id })} className="text-mute flex items-center gap-0.5 text-[12px] font-bold press"><Icon n="flag" size={15} />通報</button>}
                </div>
              </div>
            );
          })}
          {!showAll && list.length > visible.length && <button onClick={() => setShowAll(true)} className={cx(BTN_SOFT, "w-full")}>すべてのペタを見る（{list.length}件）</button>}
        </div>
      );
    }

    // 通報
    function ReportDialog({ target, onClose, onSubmit }) {
      const [reason, setReason] = useState("");
      return (
        <Dialog onClose={onClose} z={70}>
          <div className="p-5 space-y-4">
            <h3 className="font-head font-black text-[17px] flex items-center gap-1.5"><Icon n="flag" fill className="text-danger" />{target.summary ? "要約の誤りを報告" : "通報する"}</h3>
            {target.summary ? (
              <textarea rows={3} value={reason} onChange={(e) => setReason(e.target.value)} placeholder="どこが元のペタとちがっていましたか？" className={cx(INPUT, "leading-relaxed")} />
            ) : (
              <div className="space-y-1.5">
                {REPORT_REASONS.map(r => (
                  <button key={r} onClick={() => setReason(r)} aria-pressed={reason === r}
                    className={cx("w-full text-left rounded-2xl px-4 py-3 text-[13.5px] font-bold press flex items-center gap-2", reason === r ? "bg-danger-tint text-danger-ink" : "bg-sunk")}>

          <TicketCard tickets={tickets} onEarn={onEarn} />

                  <Icon n={k.unlocked ? "description" : "lock"} fill size={24} />

                <span className="flex-1 min-w-0">
                  <span className="block text-[11.5px] font-bold text-brand-deep">{k.course}</span>
                  <span className="block font-head font-bold text-[15px] leading-snug truncate">{k.title}</span>
                  <span className="flex items-center gap-2 text-[11.5px] text-mute mt-0.5">

                    {item.lines.map((l, i) => <p key={i} className="text-[14px] leading-relaxed border-b border-dashed border-[#ddd] pb-2">{l}</p>)}
                  </div>
                  <div className="absolute inset-0 flex flex-col items-center justify-center gap-1 bg-surface/40">
                    <Icon n="lock" fill size={34} className="text-ink" />
                    <p className="font-black text-[14px]">閲覧チケット1枚で見られます</p>

                  </button>
                ) : (
                  <div className="space-y-2">
                    <p className="text-[13px] text-sub text-center">チケットがありません。質問に1件答えると1枚もらえます。</p>
                    <button onClick={onEarn} className={cx(BTN_PRIMARY, "w-full flex items-center justify-center gap-1.5")}><Icon n="forum" size={20} />答えられそうな質問を探す</button>

                <p className="text-[11.5px] text-mute text-center">一度見たものは、ずっと見られます</p>
              </div>
            )}
          </div>
        </Sheet>
      );

      const [memo, setMemo] = useState("");

        <Sheet onClose={onClose}>
          <SheetHeader title="過去問・傾向メモを共有する" icon="upload_file" onClose={onClose} />
          <div className="px-5 pb-4 pt-1 overflow-y-auto space-y-4 flex-1">
            <Segmented value={kind} onChange={setKind} options={[{ value: "過去問", label: "過去問", icon: "description" }, { value: "傾向メモ", label: "傾向メモ", icon: "sticky_note_2" }]} />
            <div>
              <label className={LABEL} htmlFor="kk-course">授業名</label>

              <label className={LABEL}>写真（任意）</label>

              {photo ? (
                <div className="relative rounded-3xl overflow-hidden max-h-40 bg-sunk">
                  <img src={photo} alt="" className="w-full h-full object-cover" />
                  <button onClick={() => setPhoto(null)} aria-label="写真を取り消す" className="absolute top-2 right-2 w-8 h-8 bg-surface/90 rounded-full flex items-center justify-center press"><Icon n="close" size={18} /></button>

                <label htmlFor="kk-photo" className="border-2 border-dashed border-line rounded-2xl p-4 bg-sunk/60 flex items-center justify-center gap-2 cursor-pointer text-sub press">
