    // ============================================================
    // 👤 マイページ
    // ============================================================
    function MyPageTab({ me, posts, tickets, events, univRecords = [], onOpenEvent, onOpen, onWatch, onEditProfile, onOpenMenu, onGoKakomon }) {
      const [sub, setSub] = useState("questions");
      const myQs = posts.filter(p => p.author.mine && !p.hidden);
      const myAnswered = posts.filter(p => p.comments.some(c => c.user.mine));
      const watched = posts.filter(p => (p.watched || p.joiners.some(j => j.mine)) && !p.author.mine && !p.hidden);
      const myComments = posts.flatMap(p => p.comments.filter(c => c.user.mine));
      const gotThanks = myComments.reduce((a, c) => a + (c.thanks || 0), 0);
      const bestCount = posts.filter(p => p.bestAnswerId && p.comments.some(c => c.id === p.bestAnswerId && c.user.mine)).length;
      const list = sub === "questions" ? myQs : sub === "answers" ? myAnswered : watched;
      // イベントの記録：アプリ内（主催・参加したい）＋大学のイベント（運営が手で更新）
      const myEv = events.filter(e => e.myInterest || e.mine);
      const evCount = myEv.length + univRecords.length;
      return (
        <div className="space-y-5 animate-fade-in">
          <div className="bg-surface rounded-3xl border border-line/70 shadow-soft p-4 space-y-4">
            <div className="flex items-center gap-3">
              <Avatar user={{ fac: facShort(me.faculty), grade: me.grade }} size={56} />
              <div className="min-w-0 flex-1">
                <p className="font-head font-black text-[18px] leading-tight">{[me.faculty, me.grade ? (me.grade >= 5 ? "大学院生" : gradeLabel(me.grade)) : ""].filter(Boolean).join(" ") || U.name}</p>
                <p className="text-[12px] text-sub flex items-center gap-1"><Icon n="verified" fill size={14} className="text-brand-deep" />{U.name}・メール認証済み</p>
                <p className="text-[11.5px] text-mute">ふだんの表示：{displayName({ fac: facShort(me.faculty), grade: me.grade, anon: me.anonDefault })}</p>
              </div>
              <button onClick={onEditProfile} className="text-[12px] font-bold text-brand-deep border border-brand/50 rounded-full px-3 py-1.5 press flex-shrink-0">変更</button>
            </div>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div className="bg-sunk rounded-2xl py-2.5"><p className="text-[11px] text-sub font-bold">ペタした</p><p className="font-head font-black text-[20px]">{myComments.length}</p></div>
              <div className="bg-sunk rounded-2xl py-2.5"><p className="text-[11px] text-sub font-bold">助かった！</p><p className="font-head font-black text-[20px] text-love-ink">{gotThanks}</p></div>
              <button onClick={onGoKakomon} className="bg-brand-tint rounded-2xl py-2.5 press"><p className="text-[11px] text-brand-deep font-bold">閲覧チケット</p><p className="font-head font-black text-[20px] text-brand-deep">{tickets}</p></button>
            </div>
            {bestCount > 0 && <p className="text-[12.5px] font-bold text-brand-deep flex items-center gap-1"><Icon n="workspace_premium" fill size={16} />「いちばん助かった」に{bestCount}回選ばれました</p>}
            <p className="text-[11.5px] text-mute flex items-start gap-1 leading-relaxed"><Icon n="visibility" size={14} className="mt-px flex-shrink-0" />チケット以外はほかの人にも見えます</p>
          </div>

          <Segmented value={sub} onChange={setSub} options={[
            { value: "questions", label: `質問 ${myQs.length}` },
            { value: "answers", label: `ペタ ${myAnswered.length}` },
            { value: "watch", label: `気になる ${watched.length}` },
            { value: "events", label: `イベント ${evCount}` }
          ]} />
          {sub === "events" ? (
            <div className="space-y-4">
              <section className="space-y-2">
                <h3 className="text-[13px] font-black text-sub px-1">アプリ内の主催・参加したい</h3>
                {myEv.length === 0 && <p className="text-[12.5px] text-mute px-1">まだありません。「仲間・イベント」から探せます</p>}
                {myEv.map(e => (
                  <div key={e.id} className="space-y-1">
                    <p className="text-[11px] font-black px-1 text-brand-deep">{e.mine ? "主催" : "参加したい"}</p>
                    <EventCard ev={e} wide onOpen={() => onOpenEvent(e.id)} />
                  </div>
                ))}
              </section>
              <section className="space-y-2">
                <h3 className="text-[13px] font-black text-sub px-1 flex items-center gap-1"><Icon n="account_balance" size={16} />大学のイベント</h3>
                {univRecords.map(r => (
                  <div key={r.id} className="bg-surface rounded-2xl border border-line/70 p-3.5 flex items-center gap-3">
                    <span className={cx("text-[11px] font-black px-2 py-1 rounded-full flex-shrink-0", r.kind === "主催" ? "bg-brand text-on-brand" : r.kind === "参加" ? "bg-brand-tint text-brand-deep" : "bg-sunk text-sub")}>{r.kind}</span>
                    <span className="flex-1 min-w-0">
                      <span className="block font-bold text-[13.5px] leading-snug">{r.title}</span>
                      <span className="block text-[11.5px] text-mute">{r.date}・{r.org}</span>
                    </span>
                    <span className={cx("text-[11.5px] font-black flex-shrink-0", r.status === "参加済み" ? "text-brand-deep" : "text-sub")}>{r.status}</span>
                  </div>
                ))}
                <p className="text-[11px] text-mute px-1">大学が掲載したイベントの申し込み・参加の状況は、運営が確認して更新します</p>
              </section>
            </div>
          ) : (
          <div className="space-y-2.5">
            {list.length === 0
              ? <EmptyState icon={sub === "watch" ? "bookmark" : "forum"} text={sub === "questions" ? "まだ質問していません" : sub === "answers" ? "まだペタっていません" : "「気になる」した質問はありません"} />
              : list.map(p => <QuestionRow key={p.id} post={p} onOpen={() => onOpen(p.id)} onWatch={onWatch} />)}

              <span className={current ? "opacity-90" : "text-mute"}>{agoLabel(p.at)}・{p.odai.until.slice(5)}まで</span>
              {p.odai.migrated && <span className={current ? "opacity-90" : "text-mute"}>・ペタり場から</span>}
            </div>
            <p className="font-head font-black text-[15.5px] leading-snug">{p.title}</p>
            <div className={cx("flex items-center justify-between text-[12px] font-bold", current ? "" : "text-sub")}>
              <span className="flex items-center gap-1"><Icon n="sticky_note_2" fill size={15} />{p.comments.length}ペタ</span>
              {mine ? <span className={cx("flex items-center gap-0.5", current ? "" : "text-brand-deep")}><Icon n="check_circle" fill size={15} />ペタ済み</span>
                : <span className={cx("px-2.5 py-0.5 rounded-full font-black", current ? "bg-white text-brand-deep" : "border border-brand/50 text-brand-deep")}>見る・ペタる</span>}
            </div>
          </button>
        );
      };
      return (
        <div className="fixed inset-0 z-[25] bg-bg flex flex-col animate-push-in" role="region" aria-label="これまでのお題">
          <div className="w-full max-w-md mx-auto flex-1 flex flex-col min-h-0">
            <header className="px-2 pb-2 flex items-center gap-1 border-b border-line/70 bg-bg" style={{ paddingTop: "max(0.75rem, env(safe-area-inset-top))" }}>
              <button onClick={onBack} aria-label="ホームに戻る" className="w-11 h-11 rounded-full flex items-center justify-center press"><Icon n="arrow_back_ios_new" size={22} /></button>
              <h2 className="font-head font-black text-[17px] flex-1">これまでのお題</h2>
            </header>
            <div className="flex-1 overflow-y-auto px-4 pt-3 space-y-3" style={{ paddingBottom: "7rem" }}>
              <p className="text-[12.5px] text-sub leading-relaxed px-1">運営が毎週出しているお題です。{me.grade <= 1 ? "先輩の答えは、いつでも読み返せます。" : "過去のお題にも、いつでもペタれます。"}</p>
              {now && <Card p={now} current />}
              <h3 className="text-[12px] font-black text-sub px-1 pt-2">過去のお題（{past.length}）</h3>
              {past.map(p => <Card key={p.id} p={p} />)}
              {past.length === 0 && <EmptyState icon="campaign" text="過去のお題はまだありません" />}
            </div>
          </div>
        </div>
      );
    }

    // ✍️ 仲間を募集・イベントを作る（入力画面は1つ。「日時・場所を決める」で切り替え）
    const GATHER_CHIPS = ["テスト勉強の仲間", "TOEIC対策の仲間", "朝活の仲間", "資格の勉強仲間", "ランチ仲間", "サークルの新歓イベント"];
    function EventCreateSheet({ myLabel = "匿名", onClose, onSubmit }) {
      const pad = (n) => String(n).padStart(2, "0");
      const d0 = new Date(Date.now() + 7 * 24 * 60 * MIN);
      const ymd = `${d0.getFullYear()}-${pad(d0.getMonth() + 1)}-${pad(d0.getDate())}`;
      const [scheduled, setScheduled] = useState(false);
      const [type, setType] = useState(["オフライン"]);
      const [tags, setTags] = useState([]);
      const [title, setTitle] = useState("");
      const [desc, setDesc] = useState("");
      const [date, setDate] = useState(ymd);
      const [from, setFrom] = useState("13:00");
      const [to, setTo] = useState("15:00");
      const [place, setPlace] = useState("");
      const [cap, setCap] = useState("");
      const [hostMode, setHostMode] = useState("anon");   // anon | org（ニックネームは廃止）
      const [org, setOrg] = useState("");
      const [agree, setAgree] = useState(false);
      const toggle = (arr, set, v) => set(arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]);
      // 日時ありは主催団体名が必須（毎回入力）。いつでもの募集は「匿名・学年」か団体名
      const mode = scheduled ? "org" : hostMode;
      const hostOk = mode !== "org" || org.trim();
      const ok = title.trim() && agree && hostOk && (!scheduled || (type.length && place.trim()));
      const submit = () => {
        const host = mode === "org" ? org.trim() : "";
        const hostLabel = mode === "anon" ? myLabel : "";
        const v = { scheduled, title: title.trim(), desc: desc.trim(), tags, host, hostLabel, place: place.trim() };
        if (scheduled) Object.assign(v, { type, start: new Date(`${date}T${from}`).getTime(), end: new Date(`${date}T${to}`).getTime(), capacity: Number(cap) || 0 });
        onSubmit(v);
      };
      return (
        <Sheet onClose={onClose} z={55}>
          <SheetHeader title="仲間を募集・イベントを作る" icon="diversity_3" onClose={onClose} />
          <div className="px-5 pb-4 pt-1 overflow-y-auto space-y-4 flex-1">
            <div>
              <label className={LABEL} htmlFor="ev-title">タイトル（{title.length}/35）</label>
              <input id="ev-title" maxLength={35} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="例：TOEIC対策の仲間を探しています" className={INPUT} />
              <div className="flex flex-wrap gap-1.5 mt-2">
                {GATHER_CHIPS.map(c => <button key={c} type="button" onClick={() => setTitle(c.endsWith("仲間") ? `${c}を探しています` : c)} className="text-[12px] font-bold px-2.5 py-1 rounded-full press border border-line text-sub">{c}</button>)}
              </div>
            </div>
            <div><label className={LABEL} htmlFor="ev-desc">くわしく（任意）</label><textarea id="ev-desc" rows={3} value={desc} onChange={(e) => setDesc(e.target.value)} placeholder="どんな人に来てほしいか、頻度、持ち物など" className={cx(INPUT, "leading-relaxed")} /></div>

            {/* 日時・場所を決めるかどうか */}
            <div className="bg-sunk rounded-3xl p-3.5 space-y-3">
              <div className="flex items-center gap-3">
                <span className="flex-1 min-w-0">
                  <span className="block font-bold text-[14px]">日時・場所を決める</span>
                  <span className="block text-[11.5px] text-sub">{scheduled ? "イベントとして日付つきで表示されます" : "オフのときは「いつでも」の募集。日時は参加したい人と相談"}</span>
                </span>
                <Toggle on={scheduled} onChange={setScheduled} label="日時・場所を決める" />
              </div>
              {scheduled && (
                <div className="space-y-3 animate-fade-in">
                  <div className="flex gap-2">{["オフライン", "オンライン"].map(t => <button key={t} onClick={() => toggle(type, setType, t)} aria-pressed={type.includes(t)} className={CHIP(type.includes(t))}><Icon n={type.includes(t) ? "check_box" : "check_box_outline_blank"} size={16} />{t}</button>)}</div>
                  <div className="grid grid-cols-3 gap-2">
                    <div className="col-span-2"><label className={LABEL} htmlFor="ev-date">開催日</label><input id="ev-date" type="date" value={date} onChange={(e) => setDate(e.target.value)} className={cx(INPUT, "bg-surface")} /></div>
                    <div><label className={LABEL} htmlFor="ev-cap">定員（人）</label><input id="ev-cap" inputMode="numeric" value={cap} onChange={(e) => setCap(e.target.value.replace(/\D/g, ""))} placeholder="なし" className={cx(INPUT, "bg-surface")} /></div>
                    <div className="col-span-3 grid grid-cols-2 gap-2">
                      <div><label className={LABEL} htmlFor="ev-from">開始</label><input id="ev-from" type="time" value={from} onChange={(e) => setFrom(e.target.value)} className={cx(INPUT, "bg-surface")} /></div>
                      <div><label className={LABEL} htmlFor="ev-to">終了</label><input id="ev-to" type="time" value={to} onChange={(e) => setTo(e.target.value)} className={cx(INPUT, "bg-surface")} /></div>
                    </div>
                  </div>
                </div>
              )}
              <div><label className={LABEL} htmlFor="ev-place">{scheduled ? "開催場所" : "場所のめやす（任意）"}</label><input id="ev-place" value={place} onChange={(e) => setPlace(e.target.value)} placeholder={scheduled ? "例：図書館 グループ学習室／Zoom" : "例：平日の夕方・図書館あたり"} className={cx(INPUT, "bg-surface")} /></div>
            </div>

            <div>
              <span className={LABEL}>タグ（任意）</span>
              <div className="flex flex-wrap gap-1.5">{EVENT_TAGS.map(t => <button key={t} onClick={() => toggle(tags, setTags, t)} aria-pressed={tags.includes(t)} className={cx("text-[12px] font-bold px-2.5 py-1 rounded-full press border", tags.includes(t) ? "bg-brand-tint text-brand-deep border-brand/50" : "border-line text-sub")}>{t}</button>)}</div>
            </div>

            {/* 主催者の表示：日時ありは主催団体名が必須（毎回入力）。いつでもは匿名・学年か団体名 */}
            <div>
              <span className={LABEL}>{scheduled ? "主催団体名（必須）" : "主催者の表示"}</span>
              {!scheduled && (
                <div className="grid grid-cols-2 gap-1.5 mb-2">
                  {[["anon", `匿名（${myLabel.replace(/^匿名・?/, "") || "学年なし"}）`, "visibility_off"], ["org", "団体名", "groups"]].map(([v, l, ic]) => (
                    <button key={v} onClick={() => setHostMode(v)} aria-pressed={mode === v}
                      className={cx("py-2.5 rounded-2xl text-[12.5px] font-bold border-[1.5px] flex items-center justify-center gap-1 press", mode === v ? "bg-brand-tint text-brand-deep border-brand" : "bg-surface text-sub border-line")}>
                      <Icon n={ic} fill={mode === v} size={16} />{l}
                    </button>
                  ))}
                </div>
              )}
              {mode === "org" && <input value={org} onChange={(e) => setOrg(e.target.value)} placeholder="例：〇〇サークル、〇〇ゼミ有志" aria-label="主催団体名" className={INPUT} />}
              <p className="text-[11.5px] text-mute mt-1.5">{scheduled ? "日時・場所を決めた集まりは、参加する人が安心できるよう主催団体名を表示します" : mode === "anon" ? `「${myLabel}」と表示されます` : "団体名が表示されます"}</p>
            </div>

            <label className="flex items-start gap-3 bg-sunk rounded-3xl p-3.5 cursor-pointer select-none">
              <input type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} className="mt-1 w-4 h-4 accent-[rgb(var(--brand))]" />
              <span className="text-[13px] leading-relaxed">ガイドラインを読みました（勧誘・営業目的の募集はNG。連絡先の交換は、会ってお互いが納得してから）</span>
            </label>
          </div>
          <div className="px-4 pt-3 pb-4 border-t border-line">
            <button disabled={!ok} onClick={submit} className={cx(BTN_PRIMARY, "w-full")}>{scheduled ? "イベントとして公開する" : "仲間を募集する"}</button>
          </div>
        </Sheet>
      );
    }

    // ============================================================
    // 🤝 つながる（QRでお互いのプロフィールを見る。フォロー／フォロワーはなし）
    //   ・ここで見せるプロフィールと、Q&Aの匿名の質問・回答は紐づけない（相手に表示しない）
    // ============================================================
    // 趣味（既存サービスと同じカテゴリ・項目。選択式）
    const HOBBY_CATS = [
      { key: "スキル・技能", icon: "palette", items: ["イラスト・絵画", "料理・お菓子", "写真・動画", "音楽", "言語学習", "資格取得", "プログラミング", "コミュニケーション", "その他スキル"] },
      { key: "アウトドア", icon: "forest", items: ["キャンプ", "バーベキュー", "釣り", "サイクリング", "トレッキング", "スキー・スノボ", "サーフィン", "自然観察", "その他アウトドア"] },
      { key: "エンタメ", icon: "movie", items: ["映画・音楽", "ドラマ・アニメ", "漫画・読書", "スポーツ観戦", "ゲーム", "お笑い", "推し活", "トレカ・フィギュア", "その他エンタメ"] },
      { key: "スポーツ", icon: "sports_soccer", items: ["野球", "サッカー", "フットサル", "テニス", "バスケットボール", "ダンス", "水泳", "武道・格闘技", "その他スポーツ"] },
      { key: "巡る", icon: "explore", items: ["博物館・美術館", "カフェ・バー", "食べ歩き", "旅行・観光", "ドライブ", "夜景", "温泉", "その他巡る"] },
      { key: "その他", icon: "category", items: ["アニマル", "メイク・美容", "ファッション", "お酒", "ヨガ", "DIY", "ハンドメイド", "ボランティア", "その他"] }
    ];
    const isOtherHobby = (x) => /^その他/.test(x);   // 「その他○○」は共通点に数えない（中身が同じとは限らないため）
    // 相談に乗れること（本人が書いて表示するだけ。Q&Aの匿名回答とは結びつけない）
    const HELPS = ["履修相談OK", "一人暮らし", "バイト探し", "サークル選び", "レポート・課題", "就活・インターン", "ゼミ・研究室", `${U.short === "北大" ? "札幌" : "小樽"}の暮らし`, "地方から進学", "留学"];
    const PREFS = ["北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県", "海外"];
    const MET_PLACES = ["授業", "サークル", "新歓", "バイト", "その他"];
    const academicYear = () => { const d = new Date(); return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; };
    const entryYear = (grade) => academicYear() - (grade || 1) + 1;   // 内部では入学年で持ち、毎年4月に学年が自動で上がる
    const gradeOf = (year) => academicYear() - year + 1;                // 表示は学年（入学年は分かりにくいため）
    const AVATAR_TONES = ["bg-brand-tint text-brand-deep", "bg-sky-tint text-sky", "bg-love-tint text-love", "bg-ask-tint text-ask"];
    const toneOf = (s) => AVATAR_TONES[[...String(s || "?")].reduce((a, c) => a + c.charCodeAt(0), 0) % AVATAR_TONES.length];
    const SAMPLE_PROFILES = [
      { id: "u1", nick: "拓海", fac: U.faculties[10] || U.faculties[0], year: academicYear(), home: "北海道", hitokoto: "週末はだいたい山にいます。キャンプ道具の相談乗ります。",
        helps: [], hobbies: ["キャンプ", "釣り", "料理・お菓子"], org: "アウトドアサークル", hosted: 1, eventIds: ["e2"] },
      { id: "u2", nick: "ヤマシタ", fac: U.faculties[4] || U.faculties[0], year: academicYear() - 2, home: "東京都", hitokoto: "上京組です。一人暮らしと履修のことなら聞いてください。",
        helps: ["履修相談OK", "一人暮らし", "バイト探し"], hobbies: ["サイクリング", "カフェ・バー", "音楽"], org: "", hosted: 0, eventIds: ["e1"] }
    ];
    // 共通点：同じ学部・同じ入学年・同じ地元・同じ趣味・同じイベントに参加予定
    function commonOf(me, p, myEvents = []) {
      const out = [];
      if (me.fac && me.fac === p.fac) out.push(`同じ${me.fac}`);
      if (me.year && me.year === p.year) out.push(`同じ${gradeOf(p.year)}年生`);
      if (me.home && me.home === p.home) out.push(`地元が${p.home}`);
      (p.hobbies || []).filter(x => !isOtherHobby(x) && (me.hobbies || []).includes(x)).forEach(x => out.push(x));
      myEvents.filter(e => (p.eventIds || []).includes(e.id)).forEach(e => out.push(`同じイベント「${e.title.replace(/^【[^】]+】/, "").slice(0, 12)}…」`));
      return out;
    }

    // デモ用のQR風の模様（本物のQRコードではありません）
    function FakeQr({ seed = 7, size = 200 }) {
      const n = 25; let h = seed;
      const cells = [];
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const finder = (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
        let on;
        if (finder) { const fx = x >= n - 7 ? x - (n - 7) : x, fy = y >= n - 7 ? y - (n - 7) : y; on = fx === 0 || fy === 0 || fx === 6 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4); }
        else { h = (h * 1103515245 + 12345) >>> 0; on = (h >> 16) % 2 === 0; }
        if (on) cells.push(<rect key={`${x}-${y}`} x={x} y={y} width="1" height="1" />);
      }
      return <svg viewBox={`-2 -2 ${n + 4} ${n + 4}`} width={size} height={size} className="bg-white rounded-2xl" role="img" aria-label="あなたの二次元コード（デモ）"><g fill="#111">{cells}</g></svg>;
    }

    // 🪪 プロフィール（名刺＋自分だけのメモ）
    function ProfileCard({ p, common, conn, onMemo, myEvents = [], self = false }) {
      const fmt = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
      const chip = "text-[12px] font-bold bg-surface px-2.5 py-0.5 rounded-full";
      const placeOptions = [...myEvents.map(e => e.title.replace(/^【[^】]+】/, "").slice(0, 14)), ...MET_PLACES];
      return (
        <div className="space-y-3">
          <div className="flex flex-col items-center gap-1.5 pt-1">
            <div className={cx("w-20 h-20 rounded-full flex items-center justify-center font-head font-black text-[28px]", toneOf(p.nick))}>{(p.nick || "？").charAt(0)}</div>
            <p className="font-head font-black text-[19px]">{p.nick || "ニックネーム未設定"}</p>
            <p className="text-[12.5px] text-sub flex items-center gap-1"><Icon n="verified" fill size={15} className="text-brand-deep" />{p.fac}・{gradeOf(p.year)}年</p>
          </div>

          {common && common.length > 0 && (
            <div className="bg-brand-tint/70 border border-brand/40 rounded-3xl p-3.5 space-y-2">
              <p className="text-[13px] font-black text-brand-deep flex items-center gap-1"><Icon n="auto_awesome" fill size={16} />あなたとの共通点が{common.length}件あります！</p>
              <div className="flex flex-wrap gap-1.5">{common.map(c => <span key={c} className="text-[12px] font-bold bg-surface text-brand-deep border border-brand/40 px-2.5 py-0.5 rounded-full">✓ {c}</span>)}</div>
            </div>
          )}
          {conn && (
            <div className="bg-sunk rounded-3xl p-3.5 space-y-2.5 border border-dashed border-line">
              <p className="text-[12px] font-black text-sub flex items-center gap-1"><Icon n="edit_note" size={17} />どこで会った？<span className="font-bold text-mute">（自分だけに表示）</span></p>
              <p className="text-[13px] font-bold">{fmt(conn.at)}に{conn.how === "scanned" ? "あなたのQRを読み取ってつながった" : "QRでつながった"}{conn.place ? `・${conn.place}で` : ""}</p>
              <div className="flex flex-wrap gap-1.5">
                {placeOptions.map(x => <button key={x} type="button" onClick={() => onMemo({ place: conn.place === x ? "" : x })} aria-pressed={conn.place === x}
                  className={cx("text-[12px] font-bold px-2.5 py-1 rounded-full press border", conn.place === x ? "bg-brand text-on-brand border-brand" : "bg-surface border-line text-sub")}>{x}</button>)}
              </div>
              <textarea rows={2} value={conn.memo || ""} onChange={(e) => onMemo({ memo: e.target.value })} placeholder="例：線形代数で隣の席。札幌の古着屋に詳しい" aria-label="自分だけのメモ" className={cx(INPUT, "text-[13px] py-2.5 leading-relaxed")} />
            </div>
          )}

          {p.hitokoto && <div className="bg-sunk rounded-2xl p-3"><p className="text-[11.5px] font-bold text-sub">ひとこと</p><p className="text-[14px] leading-relaxed">{p.hitokoto}</p></div>}
          {p.helps && p.helps.length > 0 && (
            <div className="bg-sunk rounded-2xl p-3 space-y-1.5">
              <p className="text-[11.5px] font-bold text-sub flex items-center gap-1"><Icon n="volunteer_activism" size={15} className="text-brand-deep" />相談に乗れること</p>
              <div className="flex flex-wrap gap-1.5">{p.helps.map(x => <span key={x} className={cx(chip, "text-brand-deep border border-brand/40")}>{x}</span>)}</div>
            </div>
          )}
          {p.hobbies && p.hobbies.length > 0 && <div className="bg-sunk rounded-2xl p-3 space-y-1.5"><p className="text-[11.5px] font-bold text-sub">趣味</p><div className="flex flex-wrap gap-1.5">{p.hobbies.map(x => <span key={x} className={chip}>{x}</span>)}</div></div>}
          {(p.home || p.org) && (

    // 🤝 つながる（QRを読み取る／読み取られる → お互いの「つながった人」に追加 → 相手にもお知らせ）
    function ConnectSheet({ profile, myProfile, connections = [], myEvents = [], onMemo, onClose, onConnected, onOpenList }) {
      const [step, setStep] = useState("mine");   // mine → scanning → result ／ mine → (読み取られる) → result
      const [who, setWho] = useState(null);
      const [how, setHow] = useState("scan");     // scan＝自分が読み取った／scanned＝相手に読み取られた
      const [already, setAlready] = useState(false);
      const timer = useRef(null);
      useEffect(() => () => clearTimeout(timer.current), []);
      const nextPerson = () => SAMPLE_PROFILES.find(p => !connections.some(c => c.id === p.id)) || SAMPLE_PROFILES[0];
      const finish = (p, mode) => {
        const was = connections.some(c => c.id === p.id);
        setWho(p); setHow(mode); setAlready(was); setStep("result");
        if (!was) onConnected(p, mode);
      };
      const scan = () => { setStep("scanning"); timer.current = setTimeout(() => finish(nextPerson(), "scan"), 1600); };
      // デモ：自分のQRを表示している間に、友だちに読み取られた場合
      const beScanned = () => { setStep("waiting"); timer.current = setTimeout(() => finish(nextPerson(), "scanned"), 1800); };
      return (
        <Sheet onClose={onClose} z={58}>
          <SheetHeader title={step === "result" ? "つながりました" : "つながる"} icon={step === "result" ? "handshake" : "qr_code_2"} onBack={step === "result" ? () => setStep("mine") : null} onClose={onClose} />
          <div className="px-5 pb-4 pt-1 overflow-y-auto space-y-4 flex-1">
            {(step === "mine" || step === "waiting") && (<>
              <div className="flex flex-col items-center gap-3 bg-sunk rounded-3xl p-5 relative">
                <FakeQr seed={(profile.nick || "x").charCodeAt(0)} size={196} />
                <p className="font-head font-black text-[16px]">{profile.nick || "ニックネーム未設定"}</p>
                <p className="text-[12.5px] text-sub text-center leading-relaxed">このコードを友だちに読み込んでもらうと、<br />お互いのプロフィールが表示されます</p>
                {step === "waiting" && (
                  <div className="absolute inset-0 rounded-3xl bg-surface/85 backdrop-blur-[2px] flex flex-col items-center justify-center gap-2 animate-fade-in">
                    <span className="w-12 h-12 rounded-full bg-brand text-on-brand flex items-center justify-center animate-pulse"><Icon n="qr_code_scanner" size={26} /></span>
                    <p className="font-black text-[14px]">読み取られました。つないでいます…</p>
                  </div>
                )}
              </div>
              <button onClick={scan} disabled={step === "waiting"} className={cx(BTN_PRIMARY, "w-full flex items-center justify-center gap-1.5")}><Icon n="photo_camera" fill size={20} />友だちのコードを読み取る（カメラ）</button>
              <p className="text-[11.5px] text-mute text-center">どちらが読み取っても、お互いの「つながった人」に追加されます。<br />フォロー・フォロワーはありません。</p>
              <div className="border-t border-dashed border-line pt-3 text-center">
                <button onClick={beScanned} disabled={step === "waiting"} className="text-[12px] font-bold text-brand-deep press underline underline-offset-2">（デモ）友だちにこのコードを読み取ってもらう</button>
                <p className="text-[11px] text-mute mt-1">QR風の模様で、実際の読み取りは行いません</p>
              </div>
            </>)}
            {step === "scanning" && (
              <div className="aspect-square rounded-3xl bg-[#111] relative overflow-hidden flex items-center justify-center">
                <div className="w-3/5 aspect-square border-4 border-white/80 rounded-2xl relative"><div className="scan-line absolute left-2 right-2 h-0.5 bg-brand shadow-[0_0_12px_rgb(var(--brand))]"></div></div>
                <p className="absolute bottom-4 text-white text-[13px] font-bold">読み取り中…</p>
              </div>
            )}
            {step === "result" && who && (<>
              <div className={cx("rounded-3xl p-3.5 flex items-start gap-3 animate-fade-up", already ? "bg-sunk" : "bg-brand text-on-brand")}>
                <span className={cx("w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0", already ? "bg-surface text-brand-deep" : "bg-on-brand/20")}><Icon n={already ? "check" : "handshake"} fill size={22} /></span>
                <span className="min-w-0">
                  <span className="block font-black text-[15px] leading-snug">
                    {already ? `${who.nick}さんとは、すでにつながっています` : how === "scan" ? `${who.nick}さんとつながりました！` : `${who.nick}さんがあなたのコードを読み取り、つながりました！`}
                  </span>
                  {!already && <span className="block text-[12px] opacity-90 leading-relaxed mt-0.5">{how === "scan" ? `${who.nick}さんにもお知らせが届き、相手の「つながった人」にもあなたが追加されます。` : "お互いの「つながった人」に追加されました。"}</span>}
                </span>
              </div>
              <ProfileCard p={who} common={commonOf(myProfile || profile, who, myEvents)} myEvents={myEvents}
                conn={connections.find(c => c.id === who.id)} onMemo={(patch) => onMemo(who.id, patch)} />
            </>)}
          </div>
          {step === "result" && (
            <div className="px-4 pt-3 pb-4 border-t border-line grid grid-cols-2 gap-2">
              <button onClick={() => { setWho(null); setStep("mine"); }} className={cx(BTN_SOFT, "flex items-center justify-center gap-1 text-[13.5px]")}><Icon n="qr_code_scanner" size={18} />続けてつながる</button>
              <button onClick={onOpenList} className={cx(BTN_PRIMARY, "flex items-center justify-center gap-1 text-[13.5px]")}><Icon n="group" size={18} />つながった人を見る</button>
            </div>
          )}
        </Sheet>
      );
    }

    // 🏆 助かった！ランキング：先輩ごとに「助かった！」を合計し、いちばん助かったペタを1枚だけ添える
    //   ・名前は出さない（表示名＝匿名・学年。学部は本人がオンにしたときだけ）
    //   ・ほかのペタの一覧は出さない（回答者カードと同じ考え方）。ペタを押すと元の質問へ
    //   ・デモでは表示名ごとにまとめている。本番はサーバーで利用者ごとに集計する
    function RankingPage({ posts, onBack, onOpenPost, onOpenUser }) {
      useScrollLock();
      const [cat, setCat] = useState("");
      const rows = useMemo(() => {
        const m = new Map();
        posts.forEach(p => p.comments.forEach(c => {
          if (!c.user || c.user.official || !c.text) return;
          if (cat && (p.odai ? "運営のお題" : p.category) !== cat) return;
          const key = c.user.mine ? "__me" : displayName(c.user);
          const r = m.get(key) || { user: c.user, thanks: 0, answers: 0, best: null };
          r.thanks += c.thanks || 0; r.answers += 1;
          if (!r.best || (c.thanks || 0) > (r.best.thanks || 0)) r.best = { ...c, postId: p.id, q: p.title, cat: p.odai ? "運営のお題" : p.category };
          m.set(key, r);
        }));
        return [...m.values()].filter(r => r.thanks > 0).sort((a, b) => b.thanks - a.thanks || b.answers - a.answers).slice(0, 10);
      }, [posts, cat]);
      const cats = useMemo(() => [...new Set(posts.filter(p => p.comments.length && !p.odai).map(p => p.category))], [posts]);
      const medal = ["217 160 30", "140 152 168", "190 110 60"];
      return (
        <div className="fixed inset-0 z-[25] bg-bg flex flex-col animate-push-in" role="region" aria-label="助かった！ランキング">
          <div className="w-full max-w-md mx-auto flex-1 flex flex-col min-h-0">
            <header className="px-2 pb-2 flex items-center gap-1 border-b border-line/70 bg-bg" style={{ paddingTop: "max(0.75rem, env(safe-area-inset-top))" }}>
              <button onClick={onBack} aria-label="ホームに戻る" className="w-11 h-11 rounded-full flex items-center justify-center press"><Icon n="arrow_back_ios_new" size={22} /></button>
              <h2 className="font-head font-black text-[17px] flex-1">助かった！ランキング</h2>
            </header>
            <div className="flex-1 overflow-y-auto px-4 pt-3 space-y-3" style={{ paddingBottom: "7rem" }}>
              <p className="text-[12.5px] text-sub leading-relaxed px-1">「助かった！」をたくさんもらった先輩と、いちばん助かったペタです。気になるペタを押すと、元の質問が読めます。</p>
              <div className="flex gap-1.5 overflow-x-auto scrollbar-none -mx-4 px-4 pb-0.5">
                {["", ...cats].map(c => (
                  <button key={c || "all"} onClick={() => setCat(c)} aria-pressed={cat === c}
                    className={cx("flex-shrink-0 text-[12.5px] font-bold rounded-full px-3 py-1.5 border press", cat === c ? "bg-ink text-bg border-ink" : "bg-surface border-line text-sub")}>
                    {c ? catMeta(c).short : "すべて"}
                  </button>
                ))}
              </div>
              {rows.map((r, i) => {
                const c = catRGB(r.best.cat);
                return (
                  <div key={i} className={cx("rounded-3xl bg-surface border shadow-soft p-3.5 space-y-2.5 animate-fade-up", i < 3 ? "border-transparent" : "border-line")}
                    style={{ animationDelay: `${Math.min(i, 6) * 50}ms`, ...(i < 3 ? { boxShadow: `0 0 0 2px rgb(${medal[i]} / .55)` } : {}) }}>
                    <button onClick={() => onOpenUser({ ...r.user, stats: { answers: r.answers, thanks: r.thanks, best: r.best.thanks || 0 } })} className="w-full flex items-center gap-3 text-left press" aria-label={`${r.user.mine ? "あなた" : displayName(r.user)}の数字を見る`}>
                      <span className={cx("w-9 h-9 rounded-full flex items-center justify-center font-head font-black text-[16px] flex-shrink-0", i >= 3 && "bg-sunk text-sub")}
                        style={i < 3 ? { background: `rgb(${medal[i]})`, color: "#fff" } : undefined}>
                        {i < 3 ? <Icon n="trophy" fill size={19} /> : i + 1}
                      </span>
                      <span className="flex-1 min-w-0">
                        <span className="block text-[14.5px] font-black">{i < 3 && <span className="mr-1">{i + 1}位</span>}{r.user.mine ? "あなた" : displayName(r.user)}</span>
                        <span className="block text-[11.5px] text-mute font-bold">ペタ {r.answers}枚</span>
                      </span>
                      <span className="text-right flex-shrink-0">
                        <span className="block font-head font-black text-[20px] leading-none text-love-ink">{r.thanks}</span>
                        <span className="block text-[10.5px] font-bold text-mute">助かった！</span>
                      </span>
                    </button>
                    <button onClick={() => onOpenPost(r.best.postId)} className="w-full text-left rounded-2xl px-3 py-2.5 press border" style={{ background: `rgb(${c} / .07)`, borderColor: `rgb(${c} / .25)` }}>
                      <span className="block text-[11px] font-bold truncate" style={{ color: `rgb(${c})` }}>「{plainTitle(r.best.q)}」へのペタ</span>
                      <span className="block text-[13.5px] font-bold leading-relaxed line-clamp-3 mt-0.5">{r.best.text}</span>
                      <span className="flex items-center justify-between mt-1.5 text-[11.5px] font-bold">
                        <span className="text-love-ink flex items-center gap-0.5"><Icon n="favorite" fill size={14} />助かった！{r.best.thanks || 0}</span>
                        <span className="text-brand-deep flex items-center">元の質問を読む<Icon n="chevron_right" size={16} /></span>
                      </span>
                    </button>
                  </div>
                );
              })}
              {rows.length === 0 && <EmptyState icon="trophy" text="まだ「助かった！」が集まっていません" />}
              <p className="text-[11.5px] text-mute flex items-start gap-1 leading-relaxed px-1 pt-1"><Icon n="lock" size={14} className="mt-px flex-shrink-0" />名前は表示されません。1人につき、いちばん助かったペタ1枚だけを表示しています</p>
            </div>
          </div>
        </div>
      );
    }

      const restH = rest.map((p, i) => i === 0 ? { ...p, __restHead: true } : p);

      //   ・元の画面に戻る（タブを行き来する／絞り込みを解除してホームに戻る／仲間・イベントやお題一覧を閉じる／シートを閉じる）＝離れたときの位置のまま

                {!searching && (
                  <div className="pt-2 space-y-2.5 animate-fade-up">
                    <h1 className="font-head font-black text-[22px] leading-tight">{U.short}のことは、<span className="bg-clip-text text-transparent" style={{ backgroundImage: "linear-gradient(90deg, rgb(53 181 151), rgb(61 109 224))" }}>先輩に聞こう。</span></h1>
                    {/* v3：数字＋ランキングの入口（押せる帯） */}
                    <button onClick={() => setRankOpen(true)} className="w-full relative overflow-hidden rounded-2xl px-3.5 py-2.5 flex items-center gap-3 text-on-brand press shadow-soft"
                      style={{ background: "linear-gradient(110deg, rgb(53 181 151), rgb(31 140 160) 60%, rgb(61 109 224))" }} aria-label="助かった！ランキングを見る">
                      <span aria-hidden="true" className="absolute inset-0 opacity-25" style={{ backgroundImage: "radial-gradient(rgb(255 255 255 / .5) 1px, transparent 1px)", backgroundSize: "12px 12px" }}></span>
                      <span className="relative flex items-baseline gap-1"><span className="font-head font-black text-[24px] leading-none tabular-nums"><CountUp to={petaTotal} /></span><span className="text-[11.5px] font-bold opacity-95">ペタ</span></span>
                      {petaWeek > 0 && <span className="relative text-[11.5px] font-black bg-white/20 rounded-full px-2 py-0.5">今週 +{petaWeek}</span>}
                      <span className="relative ml-auto text-[12px] font-black bg-white text-brand-deep rounded-full pl-2.5 pr-1.5 py-1 flex items-center"><Icon n="trophy" fill size={15} className="mr-0.5" />ランキング<Icon n="chevron_right" size={16} /></span>
                    </button>
                  </div>
                )}
                <div className="space-y-2.5">
                  <div className="relative">
                    <Icon n="search" size={22} className="absolute left-4 top-1/2 -translate-y-1/2 text-mute" />
                    <input type="text" enterKeyHint="search" aria-label="質問を探す" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="授業名・キーワードで探す"
                      className="w-full bg-surface border border-line/80 rounded-full pl-12 pr-11 py-3 text-[14px] outline-none focus:border-brand shadow-soft" />
                    {query && <button onClick={() => setQuery("")} aria-label="検索をクリア" className="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-sunk text-sub flex items-center justify-center press"><Icon n="close" size={18} /></button>}
                  </div>
                  {!searching && (<>
                    {/* 絞り込みはホームでこの1列だけ：時期（前期・後期）に合わせた話題＋「もっと」で全カテゴリ */}
                    <div className={cx("flex gap-1.5 items-center", moreCats ? "flex-wrap" : "overflow-x-auto scrollbar-none -mx-4 px-4")}>
                                            {termMeta.topics.map(t => (
                        <button key={t.label} onClick={() => { if (t.cat) setCatFilter(t.cat); else setQuery(t.q); }} className={cx(CHIP(false), "py-1")}>
                          <Icon n={t.icon || (t.cat ? catMeta(t.cat).icon : "search")} size={14} />{t.label}
                        </button>
                      ))}
                      {moreCats && <span className="basis-full h-0"></span>}
                      {moreCats && CATEGORIES.map(c => (
                        <button key={c.key} onClick={() => setCatFilter(c.key)} className={cx(CHIP(false), "py-1")}><Icon n={c.icon} size={14} />{c.short}</button>
                      ))}
                      <button onClick={() => setMoreCats(!moreCats)} aria-expanded={moreCats} className={cx(CHIP(false), "py-1")}><Icon n={moreCats ? "expand_less" : "more_horiz"} size={14} />{moreCats ? "閉じる" : "もっと"}</button>
                    </div>
                  </>)}
                </div>

                {searching ? (
                  /* 🔎 検索・絞り込みの結果
                     ・「< ホーム」はやめ、いまの絞り込み条件を色付きの帯に「× 付きの札」で出す。×で外す／すべて外すとホームの表示に戻る */
                  <div className="space-y-3 animate-fade-in">
                    <div className="bg-brand-tint rounded-2xl px-3 py-2.5 space-y-2" role="status" aria-label="絞り込み中の条件">
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-[12px] font-black text-brand-deep flex items-center gap-1"><Icon n="filter_alt" fill size={15} />絞り込み中</span>
                        <button onClick={() => { setQuery(""); setCatFilter(""); }} className="text-[12px] font-bold text-brand-deep underline underline-offset-2 press">すべて解除</button>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {catFilter && (
                          <button onClick={() => setCatFilter("")} aria-label={`${catMeta(catFilter).short}の絞り込みを外す`} className="bg-surface text-ink border border-brand/50 text-[12.5px] font-bold pl-2.5 pr-1.5 py-1 rounded-full flex items-center gap-1 press">
                            <Icon n={catMeta(catFilter).icon} fill size={14} className="text-brand-deep" />{catMeta(catFilter).short}<Icon n="close" size={16} className="text-sub" />
                          </button>
                        )}
                        {tokens.length > 0 && (
                          <button onClick={() => setQuery("")} aria-label="キーワードを外す" className="bg-surface text-ink border border-brand/50 text-[12.5px] font-bold pl-2.5 pr-1.5 py-1 rounded-full flex items-center gap-1 press">
                            <Icon n="search" size={14} className="text-brand-deep" />「{query.trim()}」<Icon n="close" size={16} className="text-sub" />
                          </button>
                        )}
                      </div>
                    </div>
                    <div>
                      <p className="text-[11.5px] font-bold text-mute mb-1.5">{catFilter ? "カテゴリを変える" : "カテゴリでも絞り込む"}</p>
                      <ScrollRow className="flex gap-2 overflow-x-auto scrollbar-none -mx-4 px-4">
                        {CATEGORIES.map(c => (
                          <button key={c.key} onClick={() => setCatFilter(catFilter === c.key ? "" : c.key)} aria-pressed={catFilter === c.key} className={cx(CHIP(catFilter === c.key), "py-1")}>
                            <Icon n={catFilter === c.key ? "check" : c.icon} size={15} />{c.short}
                          </button>
                        ))}
                      </ScrollRow>
                    </div>
                    <div className="flex items-center justify-between gap-2 px-1">
                      <span className="text-[13px] font-black">{results.length}件の質問</span>
                      <SortToggle value={sort === "popular" ? "top" : "new"} onChange={(v) => setSort(v === "top" ? "popular" : "new")} topLabel="人気順" />
                    </div>
                    {results.length === 0
                      ? <EmptyState text="見つかりませんでした。質問してみませんか？" action="この内容で質問する" onAction={() => setAsk({ cat: catFilter || undefined, text: query.trim() || undefined })} />
                      : results.map(p => <QuestionRow key={p.id} post={p} tokens={tokens} showTop unread={unreadPostIds.has(p.id)} onOpen={() => openPost(p.id)} onWatch={toggleWatch} />)}
                  </div>
                ) : (
                  <>
                    {/* ② あなた向けの質問（回答待ち・先輩のハック・みんなの質問を1つの一覧に） */}
                    <section className="space-y-3">
                      <div className="flex items-end justify-between gap-2 px-1">
                        <h2 className="font-head font-black text-[17px]">{scope === "forYou" ? (me.grade ? `${gradeLabel(me.grade)}${me.grade >= 5 ? "" : "生"}のあなた向け` : "あなた向け") : "すべての質問"}</h2>
                        <div className="flex gap-0.5 bg-sunk rounded-full p-0.5" role="tablist" aria-label="表示する質問">
                          {[["forYou", "あなた向け"], ["all", "すべて"]].map(([v, l]) => (
                            <button key={v} role="tab" aria-selected={scope === v} onClick={() => setScope(v)} className={cx("text-[11.5px] font-bold px-2.5 py-1 rounded-full press", scope === v ? "bg-surface text-ink shadow-soft" : "text-sub")}>{l}</button>
                          ))}
                        </div>
                      </div>
                      {pinnedQ.length > 0 && <MyPinned label="ペタが届くとお知らせします">{pinnedQ.map(p => <QuestionRow key={p.id} post={p} showTop unread={unreadPostIds.has(p.id)} onOpen={() => openPost(p.id)} onWatch={toggleWatch} />)}</MyPinned>}
                      {homeFeed.map((p, i) => (
                        <React.Fragment key={p.id}>
                          {p.__answerHead && <p id="waiting" className="text-[12px] font-black text-brand-deep flex items-center gap-1 px-1 pt-1 scroll-mt-20"><Icon n="forum" size={15} />{me.grade === 1 ? "ペタ募集中" : `後輩がペタを待っています`}</p>}
                          {p.__afterWait && <p className="text-[12px] font-black text-sub flex items-center gap-1 px-1 pt-2"><Icon n="forum" size={15} />ほかの質問</p>}
                          <QuestionRow post={p} showTop delay={Math.min(i, 6) * 60} unread={unreadPostIds.has(p.id)} onOpen={() => openPost(p.id)} onWatch={toggleWatch} />
                          {/* ③ 今週のお題は一覧の途中に1枚だけ */}
                          {i === odaiSlot && odaiNow && (
                            <button onClick={() => openPost(odaiNow.id)} className="relative overflow-hidden w-full text-left text-on-brand rounded-3xl p-4 shadow-lift space-y-1.5 press"
                              style={{ background: "radial-gradient(rgb(255 255 255 / .14) 1px, transparent 1px) 0 0 / 14px 14px, linear-gradient(135deg, rgb(53 181 151), rgb(31 140 160) 60%, rgb(132 85 224))" }}>
                              <img src={LOGO_MARK} alt="" aria-hidden="true" className="absolute -right-3 -bottom-4 w-24 h-24 opacity-25 animate-floaty pointer-events-none" />
                              <span className="font-head font-black text-[13px] flex items-center gap-1"><Icon n="campaign" fill size={17} />今週のお題<span className="ml-auto text-[11px] font-bold opacity-90">{odaiNow.comments.length}ペタ</span></span>
                              <p className="font-head font-black text-[15.5px] leading-snug">{odaiNow.title}</p>
                              {odaiNow.comments.some(c => c.user.mine) && <p className="text-[12px] font-bold opacity-95">ペタ済み</p>}
                            </button>
                          )}
                          {i === odaiSlot && odaiNow && <button onClick={() => setOdaiListOpen(true)} className="-mt-1.5 text-[12px] font-bold text-brand-deep flex items-center press px-1">これまでのお題<Icon n="chevron_right" size={16} /></button>}
                        </React.Fragment>
                      ))}
                      {homeFeed.length === 0 && <EmptyState text="まだ質問がありません" action="最初の質問をする" onAction={() => setAsk({})} />}
                    </section>

                    {/* ④ 仲間・イベント・大学からは、1行の入口だけ */}
                    <button onClick={() => setEventsOpen(true)} className="w-full text-left bg-surface rounded-3xl border border-line/70 shadow-soft p-4 flex items-center gap-3 press">
                      <span className="w-11 h-11 rounded-2xl bg-brand-tint text-brand-deep flex items-center justify-center flex-shrink-0"><Icon n="diversity_3" fill size={24} /></span>
                      <span className="flex-1 min-w-0">
                        <span className="block font-head font-black text-[15px]">仲間・イベント</span>
                        <span className="block text-[12px] text-sub truncate">募集中 {openGathers.length}件・大学から {promos.length}件</span>
                      </span>
                      <Icon n="chevron_right" className="text-mute" />
                    </button>
                  </>
                )}
              </div>
            )}

            {tab === "kakomon" && (
              <KakomonTab items={kakomon} tickets={tickets} courseFilter={kakomonCourse} setCourseFilter={setKakomonCourse}
                onOpen={(k) => setKakomonId(k.id)} onEarn={goEarn} />
            )}

            {tab === "notices" && (
              <NoticesTab notices={notices} onOpen={openNotice} onReadAll={() => setNotices(prev => prev.map(n => ({ ...n, read: true })))} />
            )}

            {tab === "me" && (
              <MyPageTab me={me} posts={visiblePosts} tickets={tickets} events={events} univRecords={univRecords}
                onOpenEvent={setEventId} onOpen={openPost} onWatch={toggleWatch}
                onEditProfile={() => setProfileOpen(true)} onOpenMenu={() => setMenuOpen(true)} onGoKakomon={() => setTab("kakomon")} />
            )}
          </main>

          {/* 下部ナビ（どの画面からでもホームへ） */}
          <nav className="fixed left-0 right-0 mx-auto w-[calc(100%-1.5rem)] max-w-[26rem] glass rounded-full shadow-lift flex justify-around items-center p-1.5 z-30" style={{ bottom: "max(0.75rem, env(safe-area-inset-bottom))" }}>
            {[
              { tab: "home", icon: "home", label: "ホーム" },
              { tab: "kakomon", icon: "description", label: "過去問" },
              { center: true },
              { tab: "notices", icon: "notifications", label: "お知らせ" },
              { tab: "me", icon: "person", label: "マイページ" }
            ].map(item => item.center ? (
              <div key="center" className="w-[72px] flex-shrink-0 self-stretch relative">
                <button onClick={() => setAsk({})} aria-label="投稿する（質問・仲間・イベント・過去問）"
                  className="absolute left-1/2 -top-8 w-[66px] h-[66px] rounded-full text-on-brand flex flex-col items-center justify-center gap-0.5 press"
                  style={{ transform: "translateX(-50%)", background: "rgb(var(--brand))", boxShadow: "0 0 0 5px rgb(var(--bg)), 0 10px 20px -10px rgb(0 0 0 / .35)" }}>
                  <Icon n="add" size={30} /><span className="text-[12px] font-black leading-none">投稿</span>
                </button>
              </div>
            ) : (
              <button key={item.tab} onClick={() => { if (item.tab === "home") goHome(); else goTab(item.tab); }} aria-label={item.tab === "notices" && unreadCount > 0 ? `お知らせ（未読${unreadCount}件）` : item.label} aria-current={tab === item.tab ? "page" : undefined}
                className={cx("flex flex-col items-center gap-0.5 py-1.5 px-1.5 rounded-full min-w-[58px] press", tab === item.tab ? "text-brand-deep font-black" : "text-mute font-bold")}>
                <span className="relative">
                  <Icon n={item.icon} fill={tab === item.tab} size={24} />
                  {item.tab === "notices" && unreadCount > 0 && <span className="absolute -top-1.5 -right-2.5 min-w-[18px] h-[18px] px-1 rounded-full bg-love text-white text-[10px] font-black flex items-center justify-center ring-2 ring-surface">{unreadCount}</span>}
                </span>
                <span className="text-[10.5px] leading-none whitespace-nowrap">{item.label}</span>
              </button>
            ))}
          </nav>

          {toast && (
            <div role="status" className="fixed left-1/2 glass text-ink text-[13px] px-4 py-2.5 rounded-full shadow-lift z-[80] animate-pop font-bold w-max max-w-[88vw] text-center" style={{ top: "max(4.5rem, calc(env(safe-area-inset-top) + 3.5rem))" }}>{toast}</div>
          )}

          {selectedPost && (
            <PostDetailSheet key={selectedPost.id} post={selectedPost} me={me} firstPeta={!petaDone} onOpenUser={setUserCard} reported={reported} kakomonCount={kakomonCount} myPetaName={displayName({ fac: facShort(me.faculty), grade: me.grade, anon: true })}
              onClose={() => setSelectedPostId(null)} onWatch={toggleWatch} onAnswer={addAnswer} onThanks={toggleThanks}
              onPickBest={pickBest} onCloseRecruit={closeRecruit} onReport={setReportTarget}
              onDemoAnswer={(id) => deliverDemoReply(id, "answer")} onOpenKakomon={openKakomonOf} />
          )}
          {ask && (
            <AskSheet me={me} posts={visiblePosts} courseDict={courseDict} preset={ask} context={eventsOpen ? "gather" : tab === "kakomon" ? "kakomon" : "home"} onClose={() => setAsk(null)} onSubmit={submitQuestion}
              onJoin={joinQuestion} onOpenPost={(id) => { setAsk(null); openPost(id); }} onCreateEvent={() => { setAsk(null); setEventCreate(true); }} onShareKakomon={() => { setAsk(null); setShareOpen(true); }} />
          )}
          {ticketIntro && (
            <Dialog onClose={() => setTicketIntro(false)} z={75}>
              <div className="p-6 space-y-4 text-center">
                <Icon n="confirmation_number" fill size={48} className="text-brand" />
                <div className="space-y-1.5">
                  <h3 className="font-head font-black text-[18px]">閲覧チケットをもらいました</h3>
                  <p className="text-[13.5px] text-sub leading-relaxed">ペタってくれたお礼です。<br />チケット1枚で、先輩が共有した過去問を1件ずっと見られます。</p>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setTicketIntro(false)} className={cx(BTN_SOFT, "flex-1")}>あとで</button>
                  <button onClick={() => { setTicketIntro(false); setSelectedPostId(null); closeOverlays(); setTab("kakomon"); }} className={cx(BTN_PRIMARY, "flex-[2] text-[14px]")}>過去問を見る</button>
                </div>
              </div>
            </Dialog>
          )}
          {reportTarget && <ReportDialog target={reportTarget} onClose={() => setReportTarget(null)} onSubmit={submitReport} />}
          {kakomonId && (() => {
            const item = kakomon.find(k => k.id === kakomonId);
            return item ? <KakomonSheet item={item} tickets={tickets} onClose={() => setKakomonId(null)} onUnlock={unlockKakomon} onThanks={kakomonThanks} onEarn={goEarn} /> : null;
          })()}
          {shareOpen && <ShareKakomonSheet courseDict={courseDict} onClose={() => setShareOpen(false)} onSubmit={shareKakomon} />}
          {rankOpen && <RankingPage posts={visiblePosts} onBack={() => setRankOpen(false)} onOpenPost={openPost} onOpenUser={setUserCard} />}
          {odaiListOpen && <OdaiListPage posts={visiblePosts} term={term} me={me} onBack={() => setOdaiListOpen(false)} onOpen={openPost} />}
          {eventsOpen && (
            <EventsPage events={events} promos={promos} me={me} onBack={() => setEventsOpen(false)}
              onOpenEvent={setEventId} onOpenPromo={setPromoId} onCreate={() => setEventCreate(true)} />
          )}
          {eventId && (() => { const ev = events.find(e => e.id === eventId); return ev ? <EventSheet ev={ev} onClose={() => setEventId(null)} onInterest={toggleInterest} onCloseGather={closeGather} onReport={(id) => setReportTarget({ eventId: id })} /> : null; })()}
          {promoId && <PromoSheet promo={promos.find(p => p.id === promoId)} onClose={() => setPromoId(null)} showToast={showToast} />}
          {eventCreate && <EventCreateSheet myLabel={displayName({ fac: facShort(me.faculty), grade: me.grade, anon: true })} onClose={() => setEventCreate(false)} onSubmit={createEvent} />}
          {userCard && <AnswererCard user={userCard} stats={userCard.mine ? myStats : (userCard.stats || null)} onClose={() => setUserCard(null)} />}
          {menuOpen && (
            <MenuPage me={me} termMode={termMode} setTermMode={setTermMode} notif={notif} setNotif={setNotif}
              onClose={() => setMenuOpen(false)} onEditProfile={() => setProfileOpen(true)}
              onLogout={() => { setMenuOpen(false); setStage("gate"); setTab("home"); }} />
          )}
          {profileOpen && (
            <Sheet onClose={() => setProfileOpen(false)} z={60}>
              <SheetHeader title="学部・学年・匿名の設定" icon="badge" onClose={() => setProfileOpen(false)} />
              <div className="px-5 pb-6 pt-1 overflow-y-auto">
                <ProfileForm initial={me} showPeta saveLabel="保存する" onSave={(v) => { setMe(v); setProfileOpen(false); showToast("保存しました"); }} />
              </div>
            </Sheet>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    // 📱 PWA：サービスワーカーの登録（https か localhost で開いたときだけ）
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
    }
  </script>
</body>
</html>
